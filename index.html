l sector 農業部門\n【例句】\nThe company is investing heavily in agricultural technology to improve crop yields. (該公司正在大力投資農業技術以提高作物產量。)"}, {"id": 242, "word": "agriculture", "content": "agriculture (n.) 農業、農產品生產業\n【搭配詞】\nsustainable agriculture 永續農業\nagricultural sector 農業部門\n【例句】\nThe company is investing heavily in sustainable agriculture to reduce its environmental impact. (該公司正大力投資永續農業，以減少其對環境的影響。)"}, {"id": 243, "word": "aguilar", "content": "aguilar (n.) 阿吉拉 (Aguilar) 是一家專注於提供員工體驗和人力資源科技解決方案的公司\n【例句】\nOur HR department is evaluating Aguilar's platform to improve employee engagement. (我們的人力資源部門正在評估 Aguilar 的平台以提高員工參與度。)"}, {"id": 244, "word": "ahead", "content": "ahead (adv., prep.) 在...之前、領先、提前\n【搭配詞】\nahead of schedule 進度超前\n【例句】\nThe project is currently ahead of schedule and we expect to complete it by next week. (該專案目前進度領先，我們預計下週完成。)"}, {"id": 245, "word": "aid", "content": "aid (n.) 援助、幫助\n【搭配詞】\nfinancial aid 財務援助\nhumanitarian aid 人道援助\n【例句】\nThe department implemented innovative aid procedures to improve operational efficiency. (部門實施創新的aid程序以提高營運效率。)"}, {"id": 246, "word": "ailing", "content": "ailing (adj.) 患病的、虛弱的（指身體狀況不佳\n【詞性變化】\nailinger (adj.)\nailiest (adj.)\n【搭配詞】\nailing company 衰退的公司\nailing economy 疲軟的經濟\n【例句】\nThe employee has been granted sick leave due to an ailing condition. (該員工因身體狀況不佳已被批准休病假。)"}, {"id": 247, "word": "aim", "content": "aim (n.) 目標、瞄準\n【搭配詞】\nprimary aim 主要目標\nachieve one's aim 達成目標\n【例句】\nThe department implemented innovative aim procedures to improve operational efficiency. (部門實施創新的aim程序以提高營運效率。)"}, {"id": 248, "word": "aimed", "content": "aimed (v.) 針對...而定、以...為目標\n【例句】\nThe marketing campaign was aimed at young professionals. (這項行銷活動的目標是針對年輕專業人士。)"}, {"id": 249, "word": "aims", "content": "aims (v.) 目標、旨在\n【例句】\nOur company aims to increase market share by 10% this year. (我們公司今年的目標是將市場佔有率提高 10%。)"}, {"id": 250, "word": "air", "content": "air (n., v.) 空氣、氣流、（廣播）空中傳輸\n【搭配詞】\non the air 正在廣播中\nairfare 機票價格，常見於商務出差安排\n【例句】\nThe company is investing in air purification systems to improve indoor air quality. (公司正在投資空氣淨化系統以改善室內空氣品質。)"}, {"id": 251, "word": "aircraft", "content": "aircraft (n.) 飛機、航空器（通常指大型客機或貨機）\n【搭配詞】\naircraft maintenance 飛機維修\ncommercial aircraft 民航機\n【例句】\nThe airline announced a delay due to adverse weather conditions affecting aircraft operations. (航空公司宣布延誤，原因是惡劣天氣狀況影響飛機運營。)"}, {"id": 252, "word": "airfare", "content": "airfare (n.) 機票費用、航空票價\n【搭配詞】\nround-trip airfare 來回機票費\none-way airfare 單程機票費\n【例句】\nThe company will reimburse employees for their airfare and accommodation expenses. (公司將會退償員工的機票費用和住宿費用。)"}, {"id": 253, "word": "airline", "content": "airline (n.) 航空公司、航空運輸公司\n【搭配詞】\nairline industry 航空業\nmajor airline 大型航空公司\n【例句】\nOur company has a partnership with several major airlines to offer discounted travel packages. (我們公司與多家主要航空公司合作，提供折扣旅遊套裝。)"}, {"id": 254, "word": "airlines", "content": "airlines (n.) 航空公司、航空業\n【例句】\nSeveral airlines have announced fare reductions for the upcoming holiday season. (多家航空公司已宣布即將到來的假期期間的票價降低。)"}, {"id": 255, "word": "airplane", "content": "airplane (n.) 飛機，一種用於空中運輸人員或貨物的交通工具\n【搭配詞】\nboarding pass 登機證\noverhead compartment 頭頂置物櫃\n【例句】\nThe company is considering purchasing a new airplane to expand its international routes. (公司正在考慮購買一架新飛機以擴展其國際航線。)"}, {"id": 256, "word": "airport", "content": "airport (n.) 機場，是飛機起降及旅客搭乘的設施\n【搭配詞】\nairport terminal 機場航廈\nairport shuttle 機場接駁車\n【例句】\nThe flight is scheduled to depart from Narita Airport at 10:00 AM. (這趟航班預計在上午 10:00 從成田機場起飛。)"}, {"id": 257, "word": "airports", "content": "airports (n.) 機場\n【搭配詞】\nairport security 機場安檢\nairport shuttle 機場接駁車\n【例句】\nThe company is expanding its operations to several major airports worldwide. (公司正在擴展其業務到世界幾個主要的機場。)"}, {"id": 258, "word": "airsickness", "content": "airsickness (n.) 暈機症，飛行時因身體不適而產生的噁心或不舒服的感覺\n【搭配詞】\nsuffer from airsickness 患暈機症\nprevent/relieve airsickness 預防/緩解暈機\n【例句】\nThe airline offers complimentary ginger ale to passengers suffering from airsickness. (為了緩解乘客的暈機症狀，航空公司提供免費的薑汁汽水。)"}, {"id": 259, "word": "aisle", "content": "aisle (n.) （商店、飛機等）走道、通道\n【例句】\nThe manager asked the staff to keep the aisles clear of boxes for safety reasons. (經理要求員工為了安全起見，保持走道上沒有任何箱子。)"}, {"id": 260, "word": "alarm", "content": "alarm (n., v.) 警報、警鈴、引起注意的信號\n【搭配詞】\nfire alarm 火警警報器\nsecurity alarm 保全警報器\n【例句】\nThe security system will alarm if there's any unauthorized access. (如果有人未經授權進入，安全系統會發出警報。)"}, {"id": 261, "word": "alarming", "content": "alarming (adj.) 令人擔憂的、引起恐懼的、警訊的\n【搭配詞】\nan alarming rate 以令人擔憂的速度\n【例句】\nThe sudden drop in sales figures is an alarming trend that needs immediate attention. (銷售數字的突然下降是一個令人擔憂的趨勢，需要立即關注。)"}, {"id": 262, "word": "alas", "content": "alas (interj.) 唉、嗚呼、可惜 (表示悲傷、遺憾或憐憫的感嘆詞)\n【例句】\nAlas, the deadline for the project was missed due to unforeseen circumstances. (唉，由於不可預見的情況，專案的截止日期錯過了。)"}, {"id": 263, "word": "albeit", "content": "albeit (conj.) 儘管、雖然\n【搭配詞】\nalbeit briefly 儘管短暫\nalbeit slowly 儘管進步緩慢\n【例句】\nThe project was completed on time, albeit with some budget overruns. (這個專案儘管有一些預算超支，但仍按時完成了。)"}, {"id": 264, "word": "alberta", "content": "alberta (n.) 亞伯達省 (加拿大西部省份)\n【例句】\nOur company is expanding its operations into Alberta to tap into the region's growing energy market. (我們公司正在擴展業務至亞伯達省，以利用該地區不斷增長的能源市場。)"}, {"id": 265, "word": "album", "content": "album (n.) 專輯、相簿、集郵冊\n【搭配詞】\nrelease an album 發行專輯\nphoto album 相簿\n【例句】\nThe band released their new album last month, and it quickly topped the charts. (樂團上個月發行了他們的新專輯，並迅速登上排行榜榜首。)"}, {"id": 266, "word": "alcohol", "content": "alcohol (n.) 酒精、酒類（在商業情境中通常指飲料中的酒精成分，或與酒精相關的產品）\n【詞性變化】\nalcoholic (adj.)\n【例句】\nThe hotel policy prohibits guests from bringing alcohol into the rooms. (飯店政策禁止住客將酒精飲料帶入房間。)"}, {"id": 267, "word": "aldritch", "content": "aldritch (n.) 阿爾德里奇（Aldrich）是一家全球知名的化工試劑和精細化學品供應商，主要為科研、製藥、以及其他工業應用提供產品\n【例句】\nOur lab ordered several reagents from Aldrich for the ongoing research project. (我們的實驗室為正在進行的研究項目從阿爾德里奇訂購了幾種試劑。)"}, {"id": 268, "word": "alert", "content": "alert (adj., v., n.) 警戒、警醒、注意、提醒\n【搭配詞】\nsecurity alert 安全警報\nweather alert 天氣預警\n【例句】\nThe security system is designed to alert personnel to any unauthorized access. (安全系統旨在提醒人員注意任何未經授權的訪問。)"}, {"id": 269, "word": "algebra", "content": "algebra (n.) 代數\n【搭配詞】\nalgebraic equation 代數方程式\nlinear algebra 線性代數\n【例句】\nShe is studying advanced algebra at university. (她正在大學學習高等代數。)"}, {"id": 270, "word": "algorithm", "content": "algorithm (n.) 演算法、計算程式、運算步驟\n【搭配詞】\nsearch algorithm 搜尋演算法\nrecommendation algorithm 推薦演算法\n【例句】\nThe search engine uses a complex algorithm to rank web pages. (這個搜尋引擎使用複雜的演算法來對網頁進行排名。)"}, {"id": 271, "word": "alien", "content": "alien (n.) 外星人、（引申）與公司或團隊格格不入的人\n【搭配詞】\nresident alien 外籍居民\nalien registration card 外僑居留證\n【例句】\nThe new employee felt like an alien in the established team. (這位新進員工覺得自己融入不了這個已經建立好的團隊。)"}, {"id": 272, "word": "align", "content": "align (v.) 使一致、對準、校準\n【搭配詞】\nalign A with B 使 A 與 B 一致\nalign strategy with goals 使策略與目標一致\n【例句】\nPlease align the documents along the left margin. (請將文件沿著左邊界對齊。)"}, {"id": 273, "word": "alignment", "content": "alignment (n.) 對齊、校準、一致、結盟\n【詞性變化】\nalign (v.)\n【搭配詞】\nin alignment with 與...一致/符合\n【例句】\nEnsure proper alignment of text and images in the document. (請確保文件中文字和圖片的正確對齊。)"}, {"id": 274, "word": "alike", "content": "alike (adj., adv.) 相似的、相同的\n【例句】\nThe two companies' business strategies are remarkably alike. (這兩家公司的商業策略非常相似。)"}, {"id": 275, "word": "alive", "content": "alive (adj.) 活著的，活的、有活力的，活躍的、仍然存在的\n【搭配詞】\nstay alive 維持生命/持續\ncome alive 變得活絡/生動\n【例句】\nIs your grandfather still alive? (你的祖父還活著嗎？)"}, {"id": 276, "word": "all", "content": "all (determiner, pron., adv.) 所有、全部\n【例句】\nAll the employees are required to attend the mandatory training session. (所有員工都必須參加強制性的培訓課程。)"}, {"id": 277, "word": "all-out", "content": "all-out (adv., adj.) 全力以赴、全心全意\n【搭配詞】\nall-out effort 全力以赴\nall-out support 全力支持\n【例句】\nThe company is going all-out to launch the new product before the end of the quarter. (公司正全力以赴，力求在季度結束前推出新產品。)"}, {"id": 278, "word": "allegation", "content": "allegation (n.) （未經證實的）指控、說法、斷言\n【詞性變化】\nallege (v.)\n【例句】\nThe company denied the allegations of financial misconduct. (該公司否認了財務不當行為的指控。)"}, {"id": 279, "word": "allegations", "content": "allegations (n.) 指控、聲稱（通常指未經證實的指控）\n【詞性變化】\nalleged (adj.) 據稱的\n【搭配詞】\ndeny allegations 否認指控\nrefute allegations 反駁指控\n【例句】\nThe company is facing serious allegations of financial misconduct. (該公司正面臨嚴重的財務違規指控。)"}, {"id": 280, "word": "allege", "content": "allege (v.) （未經證實地）聲稱\n【例句】\nThe company is alleged to have violated environmental regulations. (該公司被指控違反了環境法規。)"}, {"id": 281, "word": "alleged", "content": "alleged (adj.) 據稱的、被指控的（通常指尚未被證實的說法）\n【搭配詞】\nalleged misconduct 涉嫌不當行為\nalleged violation 涉嫌違規\n【例句】\nThe company is facing an alleged breach of contract. (該公司正面臨據稱違反合約的情況。)"}, {"id": 282, "word": "allegedly", "content": "allegedly (adv.) 據稱、據說、 purportedly\n【搭配詞】\nallegedly involved in 涉嫌參與\nallegedly committed 據稱犯下\n【例句】\nThe company is facing allegations of unfair labor practices. (該公司正面臨不公平勞工慣例的指控。)"}, {"id": 283, "word": "allergic", "content": "allergic (adj.) 對特定物質過敏，產生不良反應\n【例句】\nI'm allergic to peanuts, so I can't have any snacks containing them. (我對花生過敏，所以不能吃含有花生的任何零食。)"}, {"id": 284, "word": "allergies", "content": "allergies (n.) 過敏症、對特定物質的異常免疫反應，可能導致健康問題\n【詞性變化】\nallergic (adj.) I am allergic to...\n【搭配詞】\nhave an allergy to 對...過敏\nallergic reaction 過敏反應\n【例句】\nPlease inform HR of any allergies you may have so we can ensure a safe and comfortable working environment. (請告知人力資源部門您可能有的任何過敏症，以便我們確保安全舒適的工作環境。)"}, {"id": 285, "word": "allergy", "content": "allergy (n.) 過敏反應、對特定物質的異常免疫反應，可能導致不適或健康問題\n【搭配詞】\nhave an allergy to 對...過敏\nfood allergy 食物過敏\n【例句】\nThe company policy requires employees to disclose any allergies that may affect their ability to perform their duties safely. (公司政策要求員工告知任何可能影響其安全執行職責的過敏反應。)"}, {"id": 286, "word": "alleviate", "content": "alleviate (v.) 減輕（痛苦、壓力等）、舒緩\n【搭配詞】\nalleviate traffic congestion 減緩交通擁塞\nalleviate the financial burden 減輕財務負擔\n【例句】\nThe company is offering stress management workshops to alleviate employee burnout. (公司提供壓力管理工作坊，以減輕員工的倦怠。)"}, {"id": 287, "word": "alley", "content": "alley (n.) 小巷、狹窄的通道\n【搭配詞】\nback alley 後巷\nbowling alley 保齡球館\n【例句】\nThe delivery truck had difficulty navigating the narrow alley to reach the building's rear entrance. (送貨車難以駛入狹窄的小巷，以抵達大樓的後門。)"}, {"id": 288, "word": "alliance", "content": "alliance (n.) 聯盟、結盟\n【搭配詞】\nstrategic alliance 戰略聯盟\nglobal alliance 全球聯盟\n【例句】\nThe strategic alliance between airlines has improved customer service and route coverage. (航空公司之間的戰略alliance改善了客戶服務和航線覆蓋。)"}, {"id": 289, "word": "allies", "content": "allies (n.) 盟友、合作夥伴（指在特定目標或行動中互相支持的團體或國家）\n【搭配詞】\nstrategic allies 戰略盟友\nclose allies 親密盟友\n【例句】\nOur company is seeking strategic allies to expand into the Asian market. (我們公司正在尋找戰略盟友，以擴展到亞洲市場。)"}, {"id": 290, "word": "allocate", "content": "allocate (v.) 分配\n【搭配詞】\nallocate time for training 分配時間進行培訓\n【例句】\nThe company needs to allocate more resources to the marketing department to boost sales. (公司需要將更多資源分配給行銷部門以提升銷售業績。)"}, {"id": 291, "word": "allocated", "content": "allocated (v.) （資源、時間、空間等）被分配、指定給、撥遣給\n【例句】\nThe company has allocated a budget of $10,000 for employee training. (公司已撥款 10,000 美元用於員工培訓。)"}, {"id": 292, "word": "allocation", "content": "allocation (n.) 分配\n【例句】\nThe company's new allocation initiative exceeded expectations in the first quarter. (公司的新allocation計畫在第一季度超出了預期。)"}, {"id": 293, "word": "allot", "content": "allot (v.) 分配\n【搭配詞】\nallot time 分配時間\nallot funds 分配資金\n【例句】\nThe manager decided to allot each team member a specific project. (經理決定將特定專案分配給每位團隊成員。)"}, {"id": 294, "word": "allotment", "content": "allotment (n.) （公司、政府等）分配、配額、（土地）地塊\n【例句】\nThe company made an allotment of 100 shares to each employee as a bonus. (公司將每位員工的獎金分配為 100 股。)"}, {"id": 295, "word": "allow", "content": "allow (v.) 允許、容許（在商務或工作環境中指允許某人或某事發生）\n【搭配詞】\nallow access 允許進入/存取資料\nallow a discount 給予折扣\n【例句】\nThe manager will allow employees to work from home on Fridays. (經理將允許員工在星期五在家工作。)"}, {"id": 296, "word": "allowance", "content": "allowance (n.) 津貼、生活費（通常指給予員工或家屬的固定金額，用於支付日常開銷）\n【搭配詞】\nbaggage allowance 行李限額\nhousing allowance 住房補貼\n【例句】\nThe company provides a generous housing allowance for expatriate employees. (公司為外派員工提供豐厚的住房津貼。)"}, {"id": 297, "word": "allowed", "content": "allowed (v., adj.) 被允許的、符合公司政策或法規的\n【例句】\nAll employees are allowed to work remotely on Fridays, provided they meet the security requirements. (只要符合安全要求，所有員工在星期五都被允許遠端工作。)"}, {"id": 298, "word": "allowing", "content": "allowing (v.) 允許、容許、使...可以\n【搭配詞】\nallowing for unexpected delays 考慮到非預期的延遲\n【例句】\nThe company policy allows employees to work remotely up to three days a week. (公司政策允許員工每週最多遠端工作三天。)"}, {"id": 299, "word": "allows", "content": "allows (v.) 允許、容許、使...可以\n【搭配詞】\nallow access to 允許進入/存取\nallow time for 為...預留時間\n【例句】\nThe company's policy allows employees to work remotely two days a week. (公司的政策允許員工每週在家工作兩天。)"}, {"id": 300, "word": "alluring", "content": "alluring (adj.) 具有吸引力，引人入勝，使人產生強烈興趣\n【例句】\nThe company's new marketing campaign features an alluring visual design to attract potential customers. (該公司的全新行銷活動採用引人注目的視覺設計，以吸引潛在客戶。)"}, {"id": 301, "word": "ally", "content": "ally (n., v.) 盟友、同盟國、夥伴、與…結盟\n【搭配詞】\nstrategic ally 戰略盟友\nclose ally 親密盟友\n【例句】\nThe two companies decided to ally themselves to develop a new product. (這兩家公司決定結盟以開發新產品。)"}, {"id": 302, "word": "almond", "content": "almond (n.) 杏仁\n【搭配詞】\nalmond milk 杏仁奶\nroasted almonds 烤杏仁\n【例句】\nShe added sliced almonds to her morning oatmeal for extra crunch. (她將杏仁片加入她的早餐燕麥片中，增加酥脆口感。)"}, {"id": 303, "word": "almost", "content": "almost (adv.) 幾乎、近乎\n【搭配詞】\nalmost every month 幾乎每個月\nalmost never 幾乎從不\n【例句】\nThe project is almost complete, and we expect to launch it next week. (這個專案幾乎完成了，我們預計下週將會推出。)"}, {"id": 304, "word": "alone", "content": "alone (adj., adv.) 獨自一人、孤單的\n【搭配詞】\nall alone 完全獨自一人\nlet alone 更不用說\n【例句】\nThe manager felt alone in his decision to restructure the department. (經理在重組部門的決定中感到孤單。)"}, {"id": 305, "word": "along", "content": "along (prep., adv.) 沿著、依照、隨著\n【搭配詞】\nalong with 與...一起\nget along with 與...相處\n【例句】\nThe project timeline will be adjusted along with the market trends. (專案時程將會隨著市場趨勢進行調整。)"}, {"id": 306, "word": "alongside", "content": "alongside (prep., adv.) 在...旁邊、與...一起、和...同時\n【搭配詞】\nwork alongside someone 與某人並肩工作\nsit alongside 位於...旁邊\n【例句】\nThe new intern will work alongside the marketing team to learn the ropes. (新實習生將與行銷團隊一起工作以學習基本知識。)"}, {"id": 307, "word": "alpha", "content": "alpha (n., adj.) 阿爾法（希臘字母第一字）、初步測試版、居首位的、主導者\n【搭配詞】\nbeta testing 外部公開測試\n【例句】\nThe company released the alpha version of its new software to a small group of testers. (公司向一小群測試人員發布了其新軟體的初始測試版。)"}, {"id": 308, "word": "already", "content": "already (adv.) 表示動作或情況已經發生\n【例句】\nThe report is already submitted, so please do not send a reminder. (報告已經提交，請不要發送提醒。)"}, {"id": 309, "word": "alright", "content": "alright (adj., adv.) 好的、沒問題的、可以的、安然無恙的\n【搭配詞】\nall ready 全部準備就緒\nalready 已經\n【例句】\nIs everything alright with you? (你一切都還好嗎？)"}, {"id": 310, "word": "also", "content": "also (adv.) 也、此外、又\n【例句】\nShe is a talented singer, and she also plays the piano. (她是一位才華洋溢的歌手，她也彈鋼琴。)"}, {"id": 311, "word": "alter", "content": "alter (v.) 更改、改變、修改\n【搭配詞】\nalter a schedule 修改行程\nalter the terms of a contract 修改合約條款\n【例句】\nThe company decided to alter the project timeline due to unforeseen delays. (由於 непредвиденные задержки，公司決定更改專案時間表。)"}, {"id": 312, "word": "alteration", "content": "alteration (n.) 改變、變更\n【搭配詞】\nmake alterations to 對...進行修改\n【例句】\nThe department implemented innovative alteration procedures to improve operational efficiency. (部門實施創新的alteration程序以提高營運效率。)"}, {"id": 313, "word": "altered", "content": "altered (adj., v.) 更改、修改（原樣貌或狀態）\n【詞性變化】\naltar (n.) 祭壇\nalter (v.) 改變\n【搭配詞】\nslightly altered 稍微修改\naltered plans 改變後的計畫\n【例句】\nThe contract has been altered to reflect the latest negotiations. (合約已根據最新的談判進行修改。)"}, {"id": 314, "word": "alternate", "content": "alternate (v., adj.) 作為替代方案、輪流、交替\n【搭配詞】\nalternate days 每隔一天\nalternate between A and B 在 A 與 B 之間交替\n【例句】\nWe can alternate between two shifts to ensure 24-hour coverage. (我們可以輪流工作兩個班次，以確保全天候服務。)"}, {"id": 315, "word": "alternative", "content": "alternative (n., adj.) 替代方案、其他的選擇\n【搭配詞】\nan alternative to the current proposal 目前提案的替代方案\n【例句】\nWe need to explore alternative solutions to reduce costs. (我們需要探索降低成本的其他方案。)"}, {"id": 316, "word": "alternatively", "content": "alternatively (adv.) 作為替代方案、另外地\n【例句】\nWe can ship the product via FedEx or, alternatively, UPS. (我們可以透過 FedEx 或另外透過 UPS 運送產品。)"}, {"id": 317, "word": "although", "content": "although (conj.) 雖然、儘管、即使\n【例句】\nAlthough the project faced some delays, the team managed to deliver it on time. (雖然專案遇到了一些延遲，但團隊還是成功地按時交付了它。)"}, {"id": 318, "word": "altitude", "content": "altitude (n.) 海拔、高度\n【例句】\nThe aircraft is flying at an altitude of 35,000 feet. (該飛機正以35,000英尺的高度飛行。)"}, {"id": 319, "word": "altogether", "content": "altogether (adv.) 總共、完全、全部（表示數量、程度或狀態的總和）\n【搭配詞】\naltogether different 截然不同\naltogether inappropriate 完全不適當\n【例句】\nThe project cost altogether $50,000. (這個專案總成本為 5 萬美元。)"}, {"id": 320, "word": "aluminum", "content": "aluminum (n.) 鋁 (一種輕質、銀白色的金屬元素，廣泛用於製造飛機、罐頭、廚具、建築材料等)\n【搭配詞】\naluminum foil 鋁箔\naluminum cans 鋁罐\n【例句】\nMany modern cars use aluminum parts to reduce weight and improve fuel efficiency. (許多現代汽車使用鋁製零件以減輕重量並提高燃油效率。)"}, {"id": 321, "word": "alumni", "content": "alumni (n.) 校友、畢業生（泛指）\n【搭配詞】\nalumni association 校友會\nalumni reunion 校友聚會\n【例句】\nThe university actively engages with its alumni network to foster career opportunities for current students. (大學積極與其校友網絡互動，以促進在校生的職業發展機會。)"}, {"id": 322, "word": "always", "content": "always (adv.) 總是、一直、永遠、始終、一向\n【例句】\nShe always double-checks her reports before submitting them. (她提交報告前總是會再三檢查。)"}, {"id": 323, "word": "amanda", "content": "amanda (n.) 安曼達 (Amanda) 是常見的女性名字，在商務情境中通常指代某位員工或客戶\n【例句】\nAmanda from the marketing department will be leading the presentation. (行銷部經理安曼達將負責主持簡報。)"}, {"id": 324, "word": "amateur", "content": "amateur (n., adj.) 業餘愛好者、外行、業餘的\n【搭配詞】\namateur photographer 業餘攝影師\namateur athlete 業餘運動員\n【例句】\nHe's an amateur photographer, but his work is very professional. (他是一名業餘攝影師，但他的作品非常專業。)"}, {"id": 325, "word": "amaze", "content": "amaze (v.) 使驚訝、令人印象深刻\n【例句】\nThe innovative design of the new product amazed our potential investors. (這款新產品的創新設計令我們的潛在投資人感到驚艷。)"}, {"id": 326, "word": "amazed", "content": "amazed (adj.) 驚訝、讚賞\n【例句】\nThe team was amazed by the innovative design of the new product. (團隊對新產品的創新設計感到驚訝。)"}, {"id": 327, "word": "amazement", "content": "amazement (n.) 驚訝、震驚\n【搭配詞】\nTo one's amazement 令某人驚訝的是\nin amazement 驚訝地\n【例句】\nThe team's innovative solution to the project's challenges was met with widespread amazement. (團隊對專案挑戰的創新解決方案受到了廣泛的讚賞和驚訝。)"}, {"id": 328, "word": "amazing", "content": "amazing (adj.) 令人驚嘆的、非凡的、極好的（通常指超出預期或令人印象深刻的品質或表現）\n【搭配詞】\namazing results 驚人的結果\namazing performance 卓越的表現\n【例句】\nThe presentation was truly amazing; the data clearly demonstrated the project's success. (簡報非常令人驚嘆；數據清楚地展現了專案的成功。)"}, {"id": 329, "word": "ambassador", "content": "ambassador (n.) 大使、代表\n【搭配詞】\nbrand ambassador 品牌大使\ngoodwill ambassador 親善大使\n【例句】\nThe department implemented innovative ambassador procedures to improve operational efficiency. (部門實施創新的ambassador程序以提高營運效率。)"}, {"id": 330, "word": "ambiguous", "content": "ambiguous (adj.) 模棱兩可的、含糊不清的，容易引起誤解的\n【搭配詞】\nambiguous response 模稜兩可的回答\nambiguous statement 含糊其辭的陳述\n【例句】\nThe contract's wording was ambiguous, leading to a dispute between the parties. (合約的措辭含糊不清，導致雙方產生爭執。)"}, {"id": 331, "word": "ambition", "content": "ambition (n.) 抱負、 雄心、 野心、 志向、 志氣\n【詞性變化】\nambitiously (adv.)\n【搭配詞】\nfuel one's ambition 實現或激發抱負\n【例句】\nHer ambition is to become a successful entrepreneur. (她的抱負是成為一名成功的企業家。)"}, {"id": 332, "word": "ambitious", "content": "ambitious (adj.) 抱有雄心壯志的、渴望成功的\n【詞性變化】\nambition (n.) 抱負/野心\n【搭配詞】\nambitious plan 雄心勃勃的計畫\nambitious goal 宏大的目標\n【例句】\nShe is an ambitious employee who is always looking for opportunities to advance her career. (她是一位抱有雄心壯志的員工，總是尋找晉升的機會。)"}, {"id": 333, "word": "amend", "content": "amend (v.) 修改、修正、增補\n【搭配詞】\namend a contract 修改合約\namend a proposal 修正提案\n【例句】\nThe contract needs to be amended to reflect the recent changes in regulations. (合約需要修改以反映近期法規的變動。)"}, {"id": 334, "word": "amendment", "content": "amendment (n.) 修正案\n【搭配詞】\nmake an amendment to the contract 對合約進行修正\n【例句】\nThe company's new amendment initiative exceeded expectations in the first quarter. (公司的新amendment計畫在第一季度超出了預期。)"}, {"id": 335, "word": "amenities", "content": "amenities (n.) 便利設施、俱樂部設施（指飯店、公寓等提供的附加服務或設備，例如健身房、游泳池等）\n【搭配詞】\nmodern amenities 現代化設施\nbasic amenities 基本設施\n【例句】\nThe hotel boasts a wide range of amenities, including a spa, a fitness center, and a rooftop pool. (這家飯店提供豐富的便利設施，包括水療中心、健身中心和屋頂游泳池。)"}, {"id": 336, "word": "amenity", "content": "amenity (n.) 便利設施、俱樂部設施、舒適的服務或設備（通常指飯店、度假村等提供的）\n【搭配詞】\nmodern amenities 現代化設施\nbasic amenities 基本設施\n【例句】\nThe hotel boasts a wide range of amenities, including a swimming pool, fitness center, and spa. (這家飯店提供豐富的便利設施，包括游泳池、健身中心和水療中心。)"}, {"id": 337, "word": "america", "content": "america (n.) 美國（指美國聯邦政府或美國地區），在商務情境中通常指美國市場或美國公司\n【搭配詞】\nNorth American market 北美市場\nLatin America 拉丁美洲\n【例句】\nOur company is expanding its operations into the Americas. (我們公司正在將業務拓展到美洲市場。)"}, {"id": 338, "word": "american", "content": "american (adj., n.) 美國的、美國人的、與美國相關的\n【搭配詞】\nAmerican branch 美國分部\nAmerican headquarters 美國總部\n【例句】\nThe company is expanding its operations to the American market. (該公司正在擴展其業務到美國市場。)"}, {"id": 339, "word": "americans", "content": "americans (n.) 美國人\n【例句】\nOur company is expanding its operations to attract more American clients. (我們公司正在擴展業務，以吸引更多美國客戶。)"}, {"id": 340, "word": "amid", "content": "amid (prep.) 在...之中、被...環繞、在...過程中\n【搭配詞】\namid concerns 在擔憂中\namid speculation 在推測中\n【例句】\nThe company announced a new policy amid widespread protests from employees. (在員工廣泛抗議聲中，公司宣布了一項新政策。)"}, {"id": 341, "word": "amino", "content": "amino (adj., n.) 胺基 (化學用語\n【搭配詞】\namino acid 胺基酸\n【例句】\nProteins are made up of long chains of amino acids. (蛋白質由胺基酸的長鏈組成。)"}, {"id": 342, "word": "among", "content": "among (prep.) 在...之中、其中之一\n【搭配詞】\namong the candidates 在候選人之中\namong the best 最好的之一\n【例句】\nShe found her lost wallet among the piles of old newspapers. (她在舊報紙堆中找到了她遺失的錢包。)"}, {"id": 343, "word": "amongst", "content": "amongst (prep., adv.) 在...之中，在...中間（指多個事物中\n【例句】\nThe company's products are distributed amongst various retailers across the country. (該公司的產品在全國各地的零售商之間分銷。)"}, {"id": 344, "word": "amortization", "content": "amortization (n.) 攤銷、分期償還（債務）\n【詞性變化】\namortize (v.)\n【搭配詞】\namortization schedule 分期償還表\namortization period 攤銷期限/還款期限\n【例句】\nThe company uses straight-line amortization for its intangible assets. (該公司對其無形資產採用直線攤銷法。)"}, {"id": 345, "word": "amortize", "content": "amortize (v.) 分期償還、攤銷（債務或資產）\n【詞性變化】\namortization (n.)\n【搭配詞】\namortize a loan 分期償還貸款\namortize debt 攤銷債務\n【例句】\nThe company decided to amortize the cost of the new machinery over ten years. (公司決定將新機器的成本分十年攤銷。)"}, {"id": 346, "word": "amos", "content": "amos (n.) 亞莫斯 (Amos) 是聖經舊約中的先知，在商業情境中通常指引用聖經故事或道德原則\n【詞性變化】\namass (v.) ：累積\namiss (adj.) ：出差錯的\n【搭配詞】\namass a fortune 積聚財富\namass significant data 累積大量數據\n【例句】\nThe CEO often uses biblical stories, like the tale of Amos, to illustrate the importance of ethical leadership. (執行長經常使用聖經故事，例如亞莫斯的傳記，來闡述道德領導的重要性。)"}, {"id": 347, "word": "amount", "content": "amount (n.) 數量、總數（通常指無法精確計量的東西）\n【例句】\nThe company reported a significant increase in the amount of sales this quarter. (本季公司報告銷售總額大幅增加。)"}, {"id": 348, "word": "amounts", "content": "amounts (n.) 數量、總數（通常指多個或不可計數的數量）\n【詞性變化】\namount (n.)\n【搭配詞】\na significant amount of 大量的\na considerable amount of 相當數量的\n【例句】\nThe company needs to review the amounts listed on the invoice to ensure accuracy. (公司需要審查發票上列出的金額，以確保準確性。)"}, {"id": 349, "word": "ample", "content": "ample (adj.) 充足的、大量的、充裕的\n【搭配詞】\nample time 充足的時間\nample opportunity 充裕的機會\n【例句】\nThe company has ample resources to invest in new technologies. (公司擁有充足的資源來投資新技術。)"}, {"id": 350, "word": "amplify", "content": "amplify (v.) 擴大、增強（聲音、信號等）、加強強調（觀點、感受等）\n【詞性變化】\namplifier (n.) 擴大器/增幅器\n【搭配詞】\namplify the impact 擴大影響力\namplify visibility 提高能見度\n【例句】\nThe microphone system is designed to amplify the speaker's voice for better audience reach. (麥克風系統旨在擴大演講者的聲音，以提高聽眾的覆蓋率。)"}, {"id": 351, "word": "amplitude", "content": "amplitude (n.) 振幅、廣度、幅度\n【例句】\nThe amplitude of the sound wave determines its loudness. (聲波的振幅決定了它的響度。)"}, {"id": 352, "word": "amply", "content": "amply (adv.) 充裕地、充分地、大到足以\n【詞性變化】\nample (adj.) 充足的\namplify (v.) 放大/增強\n【搭配詞】\namply rewarded 獲得充分回報\namply demonstrated 已充分證明\n【例句】\nThe company's resources are amply sufficient to cover the project's expenses. (公司的資源完全足以涵蓋專案的費用。)"}, {"id": 353, "word": "amuse", "content": "amuse (v.) 使…感到有趣或愉悅、娛樂\n【搭配詞】\namused 修飾人，感到有趣的\namusing 修飾事物，令人有趣的\n【例句】\nThe presentation included humorous anecdotes to amuse the audience. (為了娛樂聽眾，簡報中穿插了幽默的小故事。)"}, {"id": 354, "word": "amusement", "content": "amusement (n.) 娛樂、消遣、（公司）員工福利娛樂活動\n【搭配詞】\namusement park 遊樂園\nto one's amusement 令某人感到有趣的是\n【例句】\nThe company provides various amusements, such as bowling and mini-golf, to boost employee morale. (該公司提供各種娛樂活動，例如保齡球和迷你高爾夫，以提高員工士氣。)"}, {"id": 355, "word": "anabolic", "content": "anabolic (adj.) 合成代謝的、促進合成代謝的\n【詞性變化】\nanabolism (n.)\nanabolically (adv.)\n【搭配詞】\nanabolic steroids 合成代謝類固醇\nanabolic state 合成狀態\n【例句】\nAnabolic steroids are often misused by athletes to enhance performance. (合成代謝類固醇常被運動員濫用以提高表現。)"}, {"id": 356, "word": "anaerobic", "content": "anaerobic (adj., n., adv.) 厭氧的，不需要氧氣的\n【詞性變化】\nanaerobe (n.)\nanaerobically (adv.)\n【搭配詞】\nanaerobic exercise 無氧運動，如舉重、短跑\nanaerobic respiration 無氧呼吸\n【例句】\nAnaerobic bacteria can survive in environments without oxygen. (厭氧細菌可以在沒有氧氣的環境中生存。)"}, {"id": 357, "word": "analogy", "content": "analogy (n.) 類比、比喻、相似之處\n【搭配詞】\ndraw an analogy between A and B 在 A 與 B 之間作類比\nby analogy with 以此類推\n【例句】\nThe teacher used an analogy of a computer to explain how the brain works. (老師用電腦來比喻大腦的運作方式。)"}, {"id": 358, "word": "analysis", "content": "analysis (n.) 分析\n【搭配詞】\nconduct an in-depth analysis 進行深入分析\nmarket analysis 市場分析\n【例句】\nThe quarterly financial analysis revealed significant cost savings opportunities across departments. (季度財務analysis顯示各部門存在重大的成本節約機會。)"}, {"id": 359, "word": "analyst", "content": "analyst (n.) 分析師\n【詞性變化】\nanalyze (v.) 分析\nanalysis (n.) 分析報告\n【搭配詞】\nfinancial analyst 財務分析師\nmarket analyst 市場分析師\n【例句】\nThe financial analyst presented a comprehensive report on the company's performance. (財務分析師提交了一份關於公司表現的全面報告。)"}, {"id": 360, "word": "analysts", "content": "analysts (n.) 分析師、分析人員\n【搭配詞】\nfinancial analysts 財務分析師\nmarket analysts 市場分析師\n【例句】\nThe company hired several analysts to evaluate the potential risks of the merger. (該公司聘請了幾位分析師來評估併購的潛在風險。)"}, {"id": 361, "word": "analytic", "content": "analytic (adj.) 分析的、分析性的\n【詞性變化】\nanalytical (adj.)\nanalyst (n.)\n【搭配詞】\nanalytic tools 分析工具\nanalytic skills 分析能力\n【例句】\nThe company uses analytic tools to understand customer behavior. (該公司使用分析工具來了解客戶行為。)"}, {"id": 362, "word": "analytical", "content": "analytical (adj.) 分析的、善於分析的、邏輯的\n【詞性變化】\nanalyst (n.)\nanalyze (v.)\n【搭配詞】\nanalytical skills 分析能力\nanalytical tools 分析工具\n【例句】\nShe has strong analytical skills, which are crucial for this research position. (她具備很強的分析能力，這對這個研究職位來說至關重要。)"}, {"id": 363, "word": "analyze", "content": "analyze (v.) 分析、仔細研究以評估或解釋\n【搭配詞】\nanalyze data 分析數據\nanalyze market trends 分析市場趨勢\n【例句】\nThe marketing team needs to analyze the sales data to identify trends. (行銷團隊需要分析銷售數據以找出趨勢。)"}, {"id": 364, "word": "analyzed", "content": "analyzed (v.) 分析、仔細研究（某事物）以評估其組成部分或找出其重要特徵\n【詞性變化】\nanalysis (n.) 分析\nanalytical (adj.) 分析的\n【例句】\nThe marketing team analyzed the sales data to identify trends. (行銷團隊分析了銷售數據以找出趨勢。)"}, {"id": 365, "word": "analyzing", "content": "analyzing (v.) 分析、評估（數據、資訊等）以做出決策或得出結論\n【搭配詞】\nanalyzing data 分析數據\nanalyzing market trends 分析市場趨勢\n【例句】\nThe marketing team is currently analyzing sales data to identify trends. (行銷團隊目前正在分析銷售數據以找出趨勢。)"}, {"id": 366, "word": "ancestor", "content": "ancestor (n.) 祖先、祖宗、前身、原型、原種\n【詞性變化】\nancestral (adj.) 祖傳的/祖先的\n【搭配詞】\ncommon ancestor 共同祖先\ndirect ancestor 直系祖先\n【例句】\nOur ancestors came to this country over a century ago. (我們的祖先在一個多世紀前來到這個國家。)"}, {"id": 367, "word": "anchor", "content": "anchor (n., v.) 固定、錨點、（新聞）主持人\n【例句】\nThe company used the successful marketing campaign as an anchor for its new product launch. (公司將成功的行銷活動作為其新產品發布的錨點。)"}, {"id": 368, "word": "ancient", "content": "ancient (adj.) 古老的、歷史悠久的、屬於過去時代的\n【詞性變化】\nolder (adj.)\noldest (adj.)\n【搭配詞】\nancient civilization 古代文明\nancient history 古代歷史\n【例句】\nThe company is restoring the ancient building to its former glory. (該公司正在將這座古老的建築恢復到它昔日的輝煌。)"}, {"id": 369, "word": "andrew", "content": "andrew (n.) 安德魯（男子名）\n【例句】\nAndrew from the sales department will be handling the new account. (銷售部門的安德魯將負責新客戶。)"}, {"id": 370, "word": "anew", "content": "anew (adv.) 重新、再一次\n【搭配詞】\nstart anew 重新開始\nbegin life anew 展開新生活\n【例句】\nAfter the failure, they decided to start the project anew. (失敗之後，他們決定重新開始這個專案。)"}, {"id": 371, "word": "angeles", "content": "angeles (n.) 天使、（多用於地名）洛杉磯天使（Los Angeles Angels）\n【例句】\nThe marketing campaign featured the Los Angeles Angels to appeal to a wider audience. (為了吸引更廣泛的受眾，行銷活動中使用了洛杉磯天使的形象。)"}, {"id": 372, "word": "anger", "content": "anger (n., v.) 憤怒、生氣、激怒\n【搭配詞】\nexpress anger 表達憤怒\nprovoke anger 激起憤怒\n【例句】\nShe felt a surge of anger when she heard the news. (她聽到這個消息時，一股怒火湧上心頭。)"}, {"id": 373, "word": "angle", "content": "angle (n., v.) 角度、觀點、立場、從某個角度看、傾斜、有特定觀點地提出\n【搭配詞】\nfrom a different angle 從不同角度\nfrom every angle 從各個方面\n【例句】\nLet's try to look at the issue from a different angle. (讓我們試著從不同的角度來看待這個問題。)"}, {"id": 374, "word": "angry", "content": "angry (adj.) 憤怒、生氣\n【詞性變化】\nangrier (adj.)\nangriest (adj.)\n【例句】\nThe manager was angry about the missed deadline and called an emergency meeting. (經理對於錯過期限感到憤怒，並召開了緊急會議。)"}, {"id": 375, "word": "animal", "content": "animal (n.) 動物、（在商業情境中\n【搭配詞】\nanimal testing 動物實驗\nanimal shelter 動物收容所\n【例句】\nOur company is committed to sourcing animal feed from sustainable farms. (我們公司致力於從永續經營的農場採購動物飼料。)"}, {"id": 376, "word": "animals", "content": "animals (n.) 動物（廣義上指所有非人類的生物，在商務情境中可能指公司飼養的寵物、動物實驗、或與動物相關的產品/服務）\n【搭配詞】\nanimal testing 動物實驗\nanimal welfare 動物福利\n【例句】\nThe company is committed to ethical treatment of animals used in product testing. (本公司致力於對用於產品測試的動物進行道德對待。)"}, {"id": 377, "word": "animate", "content": "animate (v.) 使...栩栩如生、使...充滿活力、（電腦動畫中）使...動起來\n【搭配詞】\nanimated discussion 熱烈的討論\nanimated film 動畫片\n【例句】\nThe software allows users to animate their presentations with engaging visuals. (這款軟體允許使用者使用引人入勝的視覺效果來為他們的簡報動畫化。)"}, {"id": 378, "word": "ankle", "content": "ankle (n.) 腳踝\n【搭配詞】\nsprained ankle 扭傷腳踝\n【例句】\nShe sprained her ankle while playing basketball. (她打籃球時扭傷了腳踝。)"}, {"id": 379, "word": "annex", "content": "annex (n., v.) 附加於主要文件或建築物的一部份\n【搭配詞】\nannex to the agreement 協議附件\ntechnical annex 技術附件\n【例句】\nThe company decided to annex a new office space to accommodate the growing team. (為了容納日益擴大的團隊，公司決定附加新的辦公空間。)"}, {"id": 380, "word": "anniversary", "content": "anniversary (n.) 週年紀念，紀念日（尤指公司、組織或關係的成立或重要事件的紀念日）\n【詞性變化】\nannual (adj.) 每年的\n【搭配詞】\nanniversary celebration 週年慶祝活動\nfounding anniversary 創立週年\n【例句】\nThe company is celebrating its 10th anniversary with a special promotion. (公司將以特別促銷活動慶祝成立 10 周年。)"}, {"id": 381, "word": "annotated", "content": "annotated (adj.) 添加註釋的、已做標註的\n【搭配詞】\nannotated bibliography 有註解的書目\nannotated diagram 附說明的圖表\n【例句】\nThe sales report was heavily annotated with comments and suggestions from the marketing team. (銷售報告被行銷團隊的評論和建議大量標註。)"}, {"id": 382, "word": "announce", "content": "announce (v.) 宣告、公佈、宣布\n【搭配詞】\nannounce a merger 宣布合併\nannounce a new policy 宣布新政策\n【例句】\nThe CEO announced the company's record profits during the annual meeting. (執行長在年度會議上宣布了公司創紀錄的利潤。)"}, {"id": 383, "word": "announced", "content": "announced (v.) 宣布、公佈、宣示\n【搭配詞】\nannounce a plan 宣佈計畫\nannounce a merger 宣佈合併\n【例句】\nThe CEO announced the company's record profits during the annual shareholders' meeting. (執行長在年度股東大會上宣布了公司創紀錄的利潤。)"}, {"id": 384, "word": "announcement", "content": "announcement (n.) 公告、宣佈（通常是正式的訊息，用於告知大家重要資訊）\n【搭配詞】\nmake an announcement 發表公告\nofficial announcement 正式聲明\n【例句】\nThe company made an announcement regarding the upcoming restructuring. (公司發布了關於即將進行的重組公告。)"}, {"id": 385, "word": "announcer", "content": "announcer (n.) 播音員、廣播員、節目主持人\n【搭配詞】\nradio announcer 廣播電台播報員\nnews announcer 新聞播報員\n【例句】\nThe announcer introduced the next segment of the live show. (播音員介紹了直播節目的下一部分。)"}, {"id": 386, "word": "announcing", "content": "announcing (v., adj.) 宣告、公佈、發布（消息、資訊等）\n【搭配詞】\nannouncing a merger 宣布合併\nannouncing a new product 發布新產品\n【例句】\nThe company is announcing a new product launch next month. (公司將於下個月宣布推出新產品。)"}, {"id": 387, "word": "annoy", "content": "annoy (v.) 使人感到煩躁或惱怒、激怒\n【例句】\nConstant interruptions during the meeting annoyed the project manager. (會議中持續的中斷讓專案經理感到煩躁。)"}, {"id": 388, "word": "annoyed", "content": "annoyed (adj.) 因不滿或煩躁而感到不悅\n【搭配詞】\nannoyed with someone 對某人感到惱火\nannoyed at/about something 對某事感到生氣\n【例句】\nThe manager was annoyed by the constant interruptions during the meeting. (會議中不斷被打斷，讓經理感到非常不悅。)"}, {"id": 389, "word": "annoying", "content": "annoying (adj.) 令人煩惱的、惱人的、令人不快的\n【搭配詞】\nannoying habit 惱人的習慣\nannoying delay 令人煩躁的延誤\n【例句】\nThe constant background noise during the conference call was incredibly annoying. (會議期間持續的背景噪音非常令人煩惱。)"}, {"id": 390, "word": "annual", "content": "annual (adj.) 每年的、一年一次的（形容詞），常用於描述年度報告、會議或計畫等\n【搭配詞】\nannual report 年度報告\nannual general meeting 股東週年大會\n【例句】\nThe company will hold its annual shareholders' meeting next Thursday. (公司將於下週四舉行年度股東大會。)"}, {"id": 391, "word": "annualize", "content": "annualize (v.) 將（數據或比率）按年計算、年率化\n【詞性變化】\nannual (adj.) 每年的\nannually (adv.) 每年地\n【搭配詞】\nannualized rate 年化率\nannualized return 年化報酬率\n【例句】\nThe company decided to annualize the quarterly sales figures to project the full year's revenue. (該公司決定將季度銷售數據年率化，以預測全年的收入。)"}, {"id": 392, "word": "annually", "content": "annually (adv.) 每年、一年一次\n【搭配詞】\nheld annually 每年舉行\nreview annually 每年審查\n【例句】\nThe company reports its financial results annually. (公司每年報告其財務業績。)"}, {"id": 393, "word": "annuity", "content": "annuity (n.) 年金、養老金\n【搭配詞】\nfixed annuity 固定年金\nvariable annuity 變額年金\n【例句】\nShe bought an annuity to ensure a steady income in retirement. (她購買了一份年金，以確保退休後有穩定的收入。)"}, {"id": 394, "word": "annum", "content": "annum (n.) 年，一年（常用於片語per annum，意為「每年」）\n【搭配詞】\nper annum 每年\n【例句】\nThe company offers an attractive salary of $60,000 per annum. (公司提供每年六萬美元的優渥薪資。)"}, {"id": 395, "word": "anonymous", "content": "anonymous (adj., adv.) 不具名、匿名、未公開身分\n【搭配詞】\nanonymous donor 匿名捐贈者\nanonymous tip 匿名消息/檢舉\n【例句】\nThe company received an anonymous tip about potential safety violations. (公司收到一份關於潛在安全違規行為的匿名舉報。)"}, {"id": 396, "word": "another", "content": "another (determiner, pron.) 另一個、又一個、再一個、另一位\n【搭配詞】\nanother three days 再三天\none another 彼此\n【例句】\nCould you please give me another chance? (請再給我一次機會好嗎？)"}, {"id": 397, "word": "answer", "content": "answer (n., v.) 回覆、答覆、回應\n【搭配詞】\nanswer an inquiry 回覆詢問\nanswer a call 接電話\n【例句】\nCould you please answer the questionnaire before the meeting? (請在會議前填寫問卷並回覆。)"}, {"id": 398, "word": "answering", "content": "answering (v., n.) 回應、答覆、處理（問題、電話等）\n【搭配詞】\nanswering the phone 正在接聽電話\nAnswering inquiries is part of her job 回覆詢問是她的工作之一\n【例句】\nThe receptionist is responsible for answering phone calls and directing them to the appropriate department. (接待員負責接聽電話並將其轉至相關部門。)"}, {"id": 399, "word": "answers", "content": "answers (n., v.) 答案、回應、解決方案\n【搭配詞】\nanswers to the questionnaire 問卷的回答\nanswer the inquiry 回覆查詢\n【例句】\nThe project manager needs to review the team's answers to ensure accuracy. (專案經理需要審閱團隊的答案以確保準確性。)"}, {"id": 400, "word": "anterior", "content": "anterior (adj.) 前面的、前部的\n【搭配詞】\nanterior portion 前部\nanterior surface 前表面\n【例句】\nThe anterior part of the brain is responsible for higher-level thinking. (大腦的前部負責更高層次的思維。)"}, {"id": 401, "word": "anthropology", "content": "anthropology (n.) 人類學，研究人類及其社會、文化和發展的科學\n【詞性變化】\nanthropologist (related noun)\nanthropological (related adjective)\n【搭配詞】\ncultural anthropology 文化人類學\nanthropological research 人類學研究\n【例句】\nShe majored in anthropology and spent a year studying ancient cultures. (她主修人類學，並花了一年時間研究古代文化。)"}, {"id": 402, "word": "anti", "content": "anti (adj., n.) 作為字首，意指「反對」、「相反」或「對抗」、亦可作形容詞，意指反對的、敵對的，或作名詞，意指反對者、反對論者\n【搭配詞】\nanti-theft system 防盜系統\nanti-virus software 防毒軟體\n【例句】\nMany citizens are strongly anti the new tax proposal. (許多市民強烈反對這項新的稅收提案。)"}, {"id": 403, "word": "antibiotic", "content": "antibiotic (n.) 抗生素，用於治療細菌感染的藥物\n【搭配詞】\na course of antibiotics 一整個療程的抗生素\nprescribe antibiotics 開立抗生素處方\n【例句】\nThe company's health insurance plan covers prescription antibiotics for employees. (公司醫療保險計畫涵蓋員工處方抗生素。)"}, {"id": 404, "word": "antibody", "content": "antibody (n.) 抗體（免疫系統產生的一種蛋白質，用於識別和中和細菌、病毒等外來病原體）\n【搭配詞】\nproduce antibodies 產生抗體\nantibody test/testing 抗體檢測\n【例句】\nVaccines work by stimulating the body to produce antibodies against specific diseases. (疫苗的作用是刺激身體產生針對特定疾病的抗體。)"}, {"id": 405, "word": "anticipate", "content": "anticipate (v.) 預期、預見\n【搭配詞】\nanticipate needing more staff 預期會需要更多員工\nanticipate changes 預期變動\n【例句】\nThe marketing team needs to anticipate potential customer reactions to the new product launch. (行銷團隊需要預期客戶對新產品發布的潛在反應。)"}, {"id": 406, "word": "anticipated", "content": "anticipated (adj.) 預期的、預先設想的、預料到的\n【搭配詞】\nhighly anticipated 備受期待的\nanticipated completion date 預計完工日期\n【例句】\nThe company announced the product launch, which was highly anticipated by investors. (公司宣布產品發布，這受到投資者的熱切期盼。)"}, {"id": 407, "word": "anticipation", "content": "anticipation (n.) 預期、期盼、對將來事情的期待\n【詞性變化】\nanticipate (v.) 預期\nanticipatory (adj.) 預期的\n【例句】\nThe company is experiencing high anticipation for the launch of its new product. (公司對其新產品的推出充滿期待。)"}, {"id": 408, "word": "antigua", "content": "antigua (adj.) 古老的、歷史悠久的（通常指建築、文物等）\n【詞性變化】\nantique (adj.) 古董的、古風的\n【搭配詞】\nantique 古董的、古風的\nbound for Antigua 前往安地卡\n【例句】\nThe hotel boasts an antigua facade, blending seamlessly with the historic district. (這家酒店擁有古老的正面，與歷史街區融為一體。)"}, {"id": 409, "word": "antioxidant", "content": "antioxidant (n., adj.) 抗氧化劑（一種能防止或延緩細胞損傷的物質）、抗氧化的\n【搭配詞】\nrich in antioxidants 富含抗氧化劑\nantioxidant properties 抗氧化特性\n【例句】\nMany fruits and vegetables are rich in antioxidants, which can help protect the body's cells. (許多水果和蔬菜富含抗氧化劑，可以幫助保護身體的細胞。)"}, {"id": 410, "word": "antique", "content": "antique (n., adj.) 古董、古老且有價值的物品\n【例句】\nThe company specializes in selling antique furniture to collectors worldwide. (這家公司專門向世界各地的收藏家銷售古董家具。)"}, {"id": 411, "word": "antiquity", "content": "antiquity (n.) 古代、古物、古老\n【搭配詞】\nof great antiquity 歷史悠久\n【例句】\nThe museum has a vast collection of artifacts from antiquity. (這家博物館收藏了大量來自古代的文物。)"}, {"id": 412, "word": "antitrust", "content": "antitrust (adj., n.) 反壟斷的、反托拉斯的、反壟斷法\n【搭配詞】\nantitrust laws 反托拉斯法\nantitrust regulators 反壟斷監管機構\n【例句】\nThe company is facing an antitrust investigation over its market practices. (該公司正因其市場行為而面臨反壟斷調查。)"}, {"id": 413, "word": "anxiety", "content": "anxiety (n.) 焦慮、憂慮\n【搭配詞】\nalleviate anxiety 減輕焦慮\ncause anxiety 引起焦慮\n【例句】\nThe department implemented innovative anxiety procedures to improve operational efficiency. (部門實施創新的anxiety程序以提高營運效率。)"}, {"id": 414, "word": "anxious", "content": "anxious (adj.) 焦慮的、擔憂的\n【搭配詞】\nanxious for feedback 渴望獲得回饋\nanxious about the upcoming merger 對即將到來的合併感到擔憂\n【例句】\nThe project manager was anxious about the upcoming deadline. (專案經理對即將到來的截止日期感到焦慮。)"}, {"id": 415, "word": "any", "content": "any (determiner, pron., adv.) 任何的，一些（用於疑問句、否定句或條件句中）、任何（不論哪個、哪些）、絲毫，一點兒（用於否定句或疑問句中，修飾形容詞或副詞的比較級）\n【搭配詞】\nany further questions 任何進一步的問題\n【例句】\nPlease let us know if you have any questions. (如果您有任何問題，請告訴我們。)"}, {"id": 416, "word": "anybody", "content": "anybody (pron.) 任何人、無論誰\n【搭配詞】\nanybody else 還有其他人\nanybody interested 任何感興趣的人\n【例句】\nIs anybody home? (家裡有人嗎？)"}, {"id": 417, "word": "anyhow", "content": "anyhow (adv.) 無論如何、反正、總之、無論用何種方式\n【例句】\nI don't know if it'll work, but I'll try it anyhow. (我不知道這是否會成功，但無論如何我都會試試看。)"}, {"id": 418, "word": "anymore", "content": "anymore (adv.) 不再，從今以後不再（表示否定或變化）\n【例句】\nWe no longer offer free shipping; it's not included anymore. (我們不再提供免費運送服務，從現在開始已不包含在內。)"}, {"id": 419, "word": "anyone", "content": "anyone (pron.) 任何人、任何一人（通常用於表示不確定性或詢問是否有人符合條件）\n【搭配詞】\nanyone interested in the position 對該職位感興趣的人\nanyone wishing to attend 想參加的人\n【例句】\nIs there anyone who can speak fluent Spanish to assist our client? (請問有誰能流利地說西班牙語來協助我們的客戶嗎？)"}, {"id": 420, "word": "anything", "content": "anything (pron., adv.) 任何事物、無論什麼\n【搭配詞】\nanything but 絕非、一點也不\nnothing but 僅僅、只有\n【例句】\nIs there anything I can do to help you with your presentation? (有什麼我可以幫你準備簡報的嗎？)"}, {"id": 421, "word": "anytime", "content": "anytime (adv.) 隨時、任何時候（強調時間上的彈性，不限於特定時間點）\n【例句】\nYou can submit your expense report anytime before the end of the month. (您可以在月底前隨時提交您的費用報表。)"}, {"id": 422, "word": "anyway", "content": "anyway (adv.) 無論如何、話雖如此、總之\n【例句】\nThe project is behind schedule, but anyway, we're making progress. (專案落後於原定進度，但總之，我們正在取得進展。)"}, {"id": 423, "word": "anywhere", "content": "anywhere (adv.) 任何地方、隨處\n【搭配詞】\nanywhere else 其他任何地方\nnot anywhere near finished 離完成還差得遠\n【例句】\nThe manager said we could hold the meeting anywhere convenient for the team. (經理說我們可以選擇團隊方便的任何地方開會。)"}, {"id": 424, "word": "apart", "content": "apart (adv., prep.) 分開、隔開、遠離\n【例句】\nThe desks were arranged far apart to allow for social distancing. (為了保持社交距離，辦公桌被安排得遠遠的。)"}, {"id": 425, "word": "apartment", "content": "apartment (n.) 公寓、租賃住宅單位\n【搭配詞】\napartment complex 公寓大樓\nstudio apartment 套房\n【例句】\nThe company provides temporary apartments for relocating employees. (公司為調職員工提供臨時公寓住宿。)"}, {"id": 426, "word": "apf", "content": "apf (n.) 應用程式程式介面 (Application Programming Interface)\n【例句】\nOur developers are working to integrate the new payment gateway API into the e-commerce platform. (我們的開發人員正在努力將新的支付閘道 API 整合到電子商務平台上。)"}, {"id": 427, "word": "apologies", "content": "apologies (n., v.) 道歉、致歉\n【搭配詞】\nextend my sincere apologies 表達我誠摯的歉意\n【例句】\nPlease accept our apologies for the delay in shipment. (對於貨運延遲，敬請諒解，並接受我們的致歉。)"}, {"id": 428, "word": "apologize", "content": "apologize (v.) 對造成的不便或錯誤表示遺憾並說明原因，以維護關係或彌補過失\n【例句】\nWe apologize for the delay in delivering your order and will expedite the shipment. (我們對訂單延遲表示歉意，並將加快出貨速度。)"}, {"id": 429, "word": "apology", "content": "apology (n., v.) 道歉、對不起的表示\n【詞性變化】\napologize (v.) v.\n【搭配詞】\noffer an apology 致歉\naccept an apology 接受道歉\n【例句】\nThe company issued an apology for the shipping delay. (該公司就運輸延誤發布了道歉聲明。)"}, {"id": 430, "word": "app", "content": "app (n.) 應用程式\n【例句】\nOur company is developing a new app to streamline the order processing system. (我們公司正在開發一個新的應用程式，以簡化訂單處理系統。)"}, {"id": 431, "word": "apparatus", "content": "apparatus (n.) 設備、儀器、一套系統或裝置\n【詞性變化】\napparati (n.)\n【搭配詞】\nsafety apparatus 安全設備\nlaboratory apparatus 實驗儀器\n【例句】\nThe company invested heavily in new apparatus to improve production efficiency. (公司投入大量資金購買新設備，以提高生產效率。)"}, {"id": 432, "word": "apparel", "content": "apparel (n.) 服裝、衣著（通常指正式或商業場合的服飾）\n【搭配詞】\nathletic apparel 運動服飾\nprotective apparel 防護衣物\n【例句】\nThe company dress code requires all employees to wear professional apparel. (公司的服裝規定要求所有員工穿著專業服裝。)"}, {"id": 433, "word": "apparent", "content": "apparent (adj.) 明顯的、顯而易見的、表面上的\n【詞性變化】\napparently (adv.)\n【例句】\nIt was apparent that the project would be delayed due to unforeseen circumstances. (很明顯，由於不可預見的情況，該專案將會延遲。)"}, {"id": 434, "word": "apparently", "content": "apparently (adv.) 顯然地、似乎是\n【搭配詞】\nit is apparently true 顯然是真的\napparently unrelated 表面上不相關\n【例句】\nApparently, the project deadline has been extended due to unforeseen circumstances. (顯然地，由於一些不可預見的情況，專案截止日期已被延長。)"}, {"id": 435, "word": "appeal", "content": "appeal (n., v.) 訴願、上訴、吸引力、吸引\n【例句】\nThe company decided to appeal the court's decision. (公司決定對法院的決定提出上訴。)"}, {"id": 436, "word": "appealing", "content": "appealing (adj.) 具有吸引力，引人入勝的、令人愉悅的\n【搭配詞】\nvisually appealing 視覺上吸睛的\nappealing offer 誘人的條件\n【例句】\nThe company launched a new advertising campaign to make their product more appealing to younger consumers. (該公司推出了一項新的廣告活動，旨在使他們的產品對年輕消費者更具吸引力。)"}, {"id": 437, "word": "appear", "content": "appear (v.) 出現、呈現、顯現\n【搭配詞】\nappear likely 看起來很有可能\nappear briefly 短暫出現\n【例句】\nThe error message appeared on the screen after the system update. (系統更新後，錯誤訊息出現在螢幕上。)"}, {"id": 438, "word": "appearance", "content": "appearance (n.) 外觀、外貌、給人的印象\n【詞性變化】\napparent (adj.) 明顯的\n【搭配詞】\nProfessional appearance 專業形象/服儀\n【例句】\nThe candidate's professional appearance helped him secure the job. (這位候選人的專業外貌幫助他獲得了這份工作。)"}, {"id": 439, "word": "appeared", "content": "appeared (v.) 出現、呈現、顯現\n【例句】\nThe error message appeared on the screen after the system update. (系統更新後，錯誤訊息出現在螢幕上。)"}, {"id": 440, "word": "appears", "content": "appears (v.) 出現、呈現、顯現\n【例句】\nThe error message appears on the screen after the system update. (系統更新後，錯誤訊息會在螢幕上出現。)"}, {"id": 441, "word": "append", "content": "append (v.) 附加、增補、添加\n【例句】\nPlease append the revised document to the original email. (請將修改後的文檔附加到原始郵件中。)"}, {"id": 442, "word": "appendix", "content": "appendix (n.) 附錄\n【搭配詞】\nrefer to 參閱\n【例句】\nPlease refer to Appendix A for a detailed breakdown of the survey results. (請參閱附錄 A 以獲取調查結果的詳細分類。)"}, {"id": 443, "word": "appetite", "content": "appetite (n.) 食慾、胃口、慾望、渴望\n【搭配詞】\ninsatiable appetite 永不滿足的渴望\n【例句】\nExercising regularly can help improve your appetite. (規律運動有助於增進你的食慾。)"}, {"id": 444, "word": "appetizer", "content": "appetizer (n.) 開胃菜、餐前小點\n【搭配詞】\norder an appetizer 點開胃菜\non the appetizer menu 在開胃菜菜單上\n【例句】\nThe restaurant offers a selection of complimentary appetizers to start the meal. (這家餐廳提供一系列免費開胃菜，以開啟用餐體驗。)"}, {"id": 445, "word": "applaud", "content": "applaud (v.) 鼓掌表示讚賞或肯定\n【搭配詞】\napplaud the decision 讚賞這項決定\napplaud the efforts 肯定其努力\n【例句】\nThe audience applauded enthusiastically after the CEO's inspiring presentation. (在 CEO 啟發性的簡報後，觀眾熱烈鼓掌。)"}, {"id": 446, "word": "applause", "content": "applause (n.) 掌聲、鼓掌、喝采\n【搭配詞】\na round of applause 一陣掌聲\napplaud 鼓掌\n【例句】\nThe audience erupted in enthusiastic applause after the performance. (演出結束後，觀眾爆發出熱烈的掌聲。)"}, {"id": 447, "word": "apple", "content": "apple (n.) 蘋果、(比喻) 好的事物或機會\n【例句】\nThe company is launching a new line of apple-flavored snacks to boost sales. (該公司正在推出一系列蘋果口味的零食以提高銷售額。)"}, {"id": 448, "word": "appliance", "content": "appliance (n.) 家用電器、辦公室設備\n【搭配詞】\nhousehold/home/kitchen appliance 家用/廚房電器\nenergy-efficient/energy-saving appliance 節能電器\n【例句】\nThe office manager is responsible for ordering new appliances for the break room. (辦公室經理負責為休息室訂購新的家用電器。)"}, {"id": 449, "word": "appliances", "content": "appliances (n.) 家用電器、辦公室設備\n【搭配詞】\nhousehold appliances 家用電器\nelectrical appliances 電器用品\n【例句】\nThe company is investing in new kitchen appliances to improve employee satisfaction. (公司正在投資新的廚房電器，以提高員工滿意度。)"}, {"id": 450, "word": "applicable", "content": "applicable (adj.) 可應用的、適用的、相關的\n【詞性變化】\napplicant (n.) 申請人\n【搭配詞】\napplicable to 適用於...\n【例句】\nPlease refer to the applicable terms and conditions. (請參閱適用的條款和條件。)"}, {"id": 451, "word": "applicant", "content": "applicant (n.) 求職者、申請人\n【搭配詞】\nsuccessful applicant 錄取者\nqualified applicant 合格的應徵者\n【例句】\nThe HR department is reviewing the applications of several qualified applicants. (人力資源部門正在審閱多位合格求職者的申請。)"}, {"id": 452, "word": "applicants", "content": "applicants (n.) 申請者、應徵者\n【搭配詞】\nsuccessful applicants 錄取者\njob applicants 求職者\n【例句】\nThe HR department received over 200 applicants for the marketing manager position. (人力資源部門收到了超過 200 位應徵市場經理職位的申請者。)"}, {"id": 453, "word": "application", "content": "application (n., v.) 申請、應用、請求\n【搭配詞】\napply for 申請某職位/許可\napply to 向某單位/機構申請\n【例句】\nPlease submit your job application by Friday. (請在星期五前提交您的求職申請。)"}, {"id": 454, "word": "applications", "content": "applications (n.) 申請、應用程式、申請文件\n【搭配詞】\nsubmit an application 提交申請\nprocess applications 處理申請\n【例句】\nThe HR department is reviewing a large number of job applications. (人資部門正在審查大量的職位申請。)"}, {"id": 455, "word": "applied", "content": "applied (adj., v.) 應用、實用、被使用\n【搭配詞】\napplied science 應用科學\napplied research 應用研究\n【例句】\nThe company is looking for candidates with practical experience and applied skills. (公司正在尋找具有實際經驗和應用技能的候選人。)"}, {"id": 456, "word": "applies", "content": "applies (v.) 塗抹、適用、申請\n【例句】\nThe company applies a strict quality control process to all products. (公司對所有產品都採用嚴格的品質管制流程。)"}, {"id": 457, "word": "apply", "content": "apply (v.) 申請、塗抹、適用\n【搭配詞】\napplicable to 適用於...\n【例句】\nApplicants should apply for the position online before the deadline. (應徵者應在截止日期前透過網路申請該職位。)"}, {"id": 458, "word": "applying", "content": "applying (v.) 申請（職位、許可等）或將某項規則、方法等實施於實務中\n【例句】\nShe is applying for the marketing manager position at the headquarters. (她正在總公司申請行銷經理的職位。)"}, {"id": 459, "word": "appoint", "content": "appoint (v.) 任命、委派\n【詞性變化】\nappointment (n.)\n【例句】\nThe committee will appoint a new director next month. (委員會將在下個月任命一位新主任。)"}, {"id": 460, "word": "appointment", "content": "appointment (n.) 預約、約會（通常指正式的會議或服務預約）\n【搭配詞】\nmake an appointment 預約\nschedule an appointment 安排預約\n【例句】\nPlease reschedule your appointment with Mr. Smith to next Tuesday. (請將您與史密斯先生的預約改到下週二。)"}, {"id": 461, "word": "appointments", "content": "appointments (n.) 預約、約會（通常指商業或專業性質的安排）\n【搭配詞】\nmake/schedule an appointment 預約時間\ncancel/postpone an appointment 取消或延後預約\n【例句】\nPlease reschedule your appointment with Mr. Lee to next Tuesday. (請將您與李先生的預約改期至下週二。)"}, {"id": 462, "word": "appraisal", "content": "appraisal (n., v.) 評估、評鑑、估價（尤指工作績效）\n【搭配詞】\nperformance appraisal 績效評估\nannual appraisal 年度考評\n【例句】\nThe annual performance appraisal will help employees identify areas for improvement. (年度績效評估將幫助員工找出需要改進的領域。)"}, {"id": 463, "word": "appreciate", "content": "appreciate (v.) 感激、欣賞、體會到價值\n【搭配詞】\nhighly appreciate 高度讚賞\nappreciate the opportunity 感激有此機會\n【例句】\nWe appreciate your prompt response and cooperation in resolving this issue. (我們感謝您在解決此問題上的快速回覆與合作。)"}, {"id": 464, "word": "appreciated", "content": "appreciated (adj., v.) 感激、重視、欣賞\n【詞性變化】\nappreciate (v.)\ngrateful (adj.)\n【搭配詞】\nYour prompt reply would be greatly appreciated 若能儘速回覆將不勝感激\n【例句】\nYour prompt response and dedication to this project are greatly appreciated. (您對此專案的快速回覆和奉獻精神備受我們感激。)"}, {"id": 465, "word": "appreciates", "content": "appreciates (v.) 重視、欣賞、感謝（某事物的價值或重要性）\n【搭配詞】\nappreciate your patience 感謝您的耐心\nappreciate having the opportunity 感謝有此機會\n【例句】\nThe company appreciates your prompt response and valuable feedback. (公司感謝您迅速的回應和寶貴的意見回饋。)"}, {"id": 466, "word": "appreciation", "content": "appreciation (n., v.) 對某事或某人的感激之情、對價值的認識\n【搭配詞】\nexpress/show appreciation for 對...表示感謝\nin appreciation of 為了感謝...\n【例句】\nThe company showed its appreciation for the team's hard work with a bonus. (公司以獎金回報團隊的辛勤工作，以示感激。)"}, {"id": 467, "word": "appreciative", "content": "appreciative (adj.) 表示對某事或某人感到感激、欣賞的、重視、體認到價值或貢獻的\n【例句】\nThe manager was appreciative of the team's hard work and dedication to the project. (經理對團隊在專案中付出的辛勤工作和奉獻精神表示讚賞。)"}, {"id": 468, "word": "apprehensive", "content": "apprehensive (adj.) 感到擔憂或不安，對將來的事情感到焦慮\n【搭配詞】\nbe apprehensive about the merger 對併購感到憂慮\n【例句】\nThe team was apprehensive about the upcoming merger negotiations. (團隊對即將到來的併購談判感到擔憂。)"}, {"id": 469, "word": "apprentice", "content": "apprentice (n.) 學徒、見習者（通常指在專業領域接受訓練並學習技能的人）\n【搭配詞】\napprenticeship program 見習計畫\nserve an apprenticeship 擔任學徒\n【例句】\nThe company offers an apprenticeship program for recent graduates interested in a career in engineering. (該公司為對工程領域有興趣的應屆畢業生提供學徒計畫。)"}, {"id": 470, "word": "approach", "content": "approach (n., v.) 靠近、方法、態度\n【搭配詞】\nsystematic approach 系統性的方法\ninnovative approach 創新方法\n【例句】\nThe team needs to approach the project with a new strategy to improve efficiency. (團隊需要以新的策略來處理這個專案，以提高效率。)"}, {"id": 471, "word": "appropriate", "content": "appropriate (adj.) 合適的、恰當的、適當的，符合需求的\n【搭配詞】\nappropriate for/to 適合於...\ntake appropriate action/measures 採取適當措施\n【例句】\nThe attire for the conference is business casual – something appropriate for a professional setting. (這場會議的服裝是商務休閒風格，適合專業場合。)"}, {"id": 472, "word": "appropriately", "content": "appropriately (adv.) 適當地、恰當地（指行為、言辭等符合情境或場合）\n【搭配詞】\ndress appropriately 穿著得體\nrespond appropriately 適當回應\n【例句】\nThe manager addressed the employee's concerns appropriately, ensuring a positive outcome. (經理適當地處理了員工的顧慮，確保了積極的結果。)"}, {"id": 473, "word": "approval", "content": "approval (n., v.) 批准、認可、同意\n【搭配詞】\nobtain/get approval 獲得批准\nsubject to approval 取決於批准\n【例句】\nThe project requires approval from the department head before it can proceed. (專案需要在部門主管批准後才能繼續進行。)"}, {"id": 474, "word": "approve", "content": "approve (v.) 核准、批准、同意\n【搭配詞】\napprove the budget 核准預算\nobtain/get approval 獲得批准\n【例句】\nThe manager needs to approve the expense report before reimbursement. (經理需要在報銷前核准費用報告。)"}, {"id": 475, "word": "approved", "content": "approved (adj.) 批准、核准、同意\n【搭配詞】\napproved budget 經核准的預算\napproved vendor 合格的供應商\n【例句】\nThe project proposal has been approved by the management team. (該專案提案已獲得管理團隊的批准。)"}, {"id": 476, "word": "approximate", "content": "approximate (adj., v.) 大約的、近似的、估計的 (adj.)、近似、估計 (v.)\n【搭配詞】\napproximate cost 大約成本\napproximate arrival time 大約抵達時間\n adj.) 任意的、武斷的、隨意的、專斷的\n【詞性變化】\narbitrarily (adv.)\n【搭配詞】\nan arbitrary decision 武斷的決定\n【例句】\nThe committee's decision seemed arbitrary, as there was no clear reason for their choice. (委員會的決定似乎很武斷，因為他們的選擇沒有明確的理由。)"}, {"id": 486, "word": "arbitration", "content": "arbitration (n.) 仲裁\n【搭配詞】\nBinding arbitration 具法律約束力的仲裁\nArbitration clause 仲裁條款\n【例句】\nThe company's new arbitration initiative exceeded expectations in the first quarter. (公司的新arbitration計畫在第一季度超出了預期。)"}, {"id": 487, "word": "arc", "content": "arc (n., v.) 弧形，弧線、弧光、弧形運動、形成弧形，沿弧線移動\n【搭配詞】\ncareer arc 職業生涯軌跡\nnarrative arc 敘事弧線\n【例句】\nThe bridge has a graceful arc over the river. (這座橋在河面上形成一道優雅的弧線。)"}, {"id": 488, "word": "arch", "content": "arch (n., v.) 拱形、建築物頂部彎曲的結構、（比喻）頂點，高峰\n【搭配詞】\narch 拱形/主要的\narchive 檔案/存檔\n【例句】\nThe architect designed a beautiful archway to enhance the entrance of the building. (建築師設計了一個美麗的拱門，以提升建築物的入口。)"}, {"id": 489, "word": "archaeology", "content": "archaeology (n.) 考古學\n【搭配詞】\narchaeological site 考古遺址\nexcavation project 挖掘計畫\n【例句】\nThe discovery of ancient artifacts is central to archaeology. (發現古代文物是考古學的核心。)"}, {"id": 490, "word": "archery", "content": "archery (n.) 箭術、射箭\n【搭配詞】\narchery range 射箭場\narchery equipment 射箭器材\n【例句】\nThe company is considering offering archery as a team-building activity for employees. (公司正在考慮為員工提供射箭作為團隊建設活動。)"}, {"id": 491, "word": "architect", "content": "architect (n.) 建築師，負責設計和規劃建築物及相關空間\n【搭配詞】\nchief architect 首席建築師\nrenowned architect 著名的建築師\n【例句】\nThe company hired an architect to design the new office building. (公司聘請了一位建築師來設計新的辦公大樓。)"}, {"id": 492, "word": "architects", "content": "architects (n.) 建築師、設計師（專注於建築物和空間的設計者）\n【搭配詞】\nLead architects 首席建築師\nArchitecture firm 建築事務所\n【例句】\nThe company hired experienced architects to design the new office building. (公司聘請了經驗豐富的建築師來設計新的辦公大樓。)"}, {"id": 493, "word": "architectural", "content": "architectural (adj.) 與建築設計或風格相關的、建築學的\n【搭配詞】\narchitectural firm 建築師事務所\narchitectural plans 建築圖面\n【例句】\nThe
