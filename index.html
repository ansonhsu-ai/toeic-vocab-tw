        /**
         * 語音朗讀服務類別 (AudioService)
         */
        class AudioService {
            constructor() {
                this.synth = window.speechSynthesis || null;
                this.voice = null;
                this.initVoice();
            }

            initVoice() {
                if (!this.synth) return;
                try {
                    const updateVoice = () => {
                        const voices = this.synth.getVoices();
                        this.voice = voices.find(v => v.lang.includes('en-US')) || voices.find(v => v.lang.startsWith('en')) || null;
                    };
                    updateVoice();
                    if (this.synth.onvoiceschanged !== undefined) {
                        this.synth.onvoiceschanged = updateVoice;
                    }
                } catch (e) {
                    console.warn('Speech synthesis voice init error', e);
                }
            }

            speak(text) {
                if (!this.synth || !text) return;
                try {
                    this.synth.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US';
                    utterance.rate = 0.95;
                    if (this.voice) utterance.voice = this.voice;
                    this.synth.speak(utterance);
                } catch (e) {
                    console.warn('Speak error', e);
                }
            }

            extractEnglishSentence(content) {
                if (!content) return '';
                const match = content.match(/【例句】\s*\n?([^\n(（]+)/);
                if (match && match[1]) {
                    return match[1].trim();
                }
                return '';
            }
        }

        /**
         * 本地持久化儲存服務 (StorageService)
         */
        class StorageService {
            constructor() {
                this.dbName = 'ToeicFlashcardDB_v2';
                this.storeName = 'app_state';
                this.db = null;
            }

            async init() {
                return new Promise((resolve) => {
                    if (!window.indexedDB) {
                        resolve(false);
                        return;
                    }
                    let resolved = false;
                    const timer = setTimeout(() => {
                        if (!resolved) {
                            resolved = true;
                            resolve(false);
                        }
                    }, 400);

                    try {
                        const request = indexedDB.open(this.dbName, 1);
                        request.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains(this.storeName)) {
                                db.createObjectStore(this.storeName);
                            }
                        };
                        request.onsuccess = (e) => {
                            if (!resolved) {
                                resolved = true;
                                clearTimeout(timer);
                                this.db = e.target.result;
                                resolve(true);
                            }
                        };
                        request.onerror = () => {
                            if (!resolved) {
                                resolved = true;
                                clearTimeout(timer);
                                resolve(false);
                            }
                        };
                    } catch (e) {
                        if (!resolved) {
                            resolved = true;
                            clearTimeout(timer);
                            resolve(false);
                        }
                    }
                });
            }

            async save(key, value) {
                if (this.db) {
                    try {
                        const tx = this.db.transaction([this.storeName], 'readwrite');
                        const store = tx.objectStore(this.storeName);
                        store.put(value, key);
                        return;
                    } catch (e) {}
                }
                try {
                    localStorage.setItem(key, JSON.stringify(value));
                } catch (e) {}
            }

            async load(key) {
                if (this.db) {
                    try {
                        return await new Promise((resolve) => {
                            const tx = this.db.transaction([this.storeName], 'readonly');
                            const store = tx.objectStore(this.storeName);
                            const req = store.get(key);
                            req.onsuccess = () => resolve(req.result);
                            req.onerror = () => resolve(null);
                        });
                    } catch (e) {}
                }
                try {
                    const raw = localStorage.getItem(key);
                    return raw ? JSON.parse(raw) : null;
                } catch (e) {
                    return null;
                }
            }

            async clear() {
                if (this.db) {
                    try {
                        const tx = this.db.transaction([this.storeName], 'readwrite');
                        tx.objectStore(this.storeName).clear();
                    } catch (e) {}
                }
                try {
                    localStorage.removeItem('srs_flashcard_state');
                } catch (e) {}
            }
        }

        /**
         * CSV 解析服務 (CsvParserService)
         */
        class CsvParserService {
            static parse(csvText) {
                if (!csvText || typeof csvText !== 'string' || !csvText.trim()) {
                    throw new Error('CSV 檔案為空或內容無效');
                }

                const rows = [];
                let currentRow = [];
                let currentField = '';
                let insideQuotes = false;
                let i = 0;

                let text = csvText.charCodeAt(0) === 0xFEFF ? csvText.slice(1) : csvText;

                while (i < text.length) {
                    const char = text[i];
                    const nextChar = text[i + 1];

                    if (char === '"') {
                        if (insideQuotes && nextChar === '"') {
                            currentField += '"';
                            i += 2;
                            continue;
                        } else {
                            insideQuotes = !insideQuotes;
                            i++;
                            continue;
                        }
                    }

                    if (!insideQuotes && char === ',') {
                        currentRow.push(currentField.trim());
                        currentField = '';
                        i++;
                        continue;
                    }

                    if (!insideQuotes && (char === '\r' || char === '\n')) {
                        if (char === '\r' && nextChar === '\n') {
                            i++;
                        }
                        currentRow.push(currentField.trim());
                        currentField = '';
                        if (currentRow.some(f => f.length > 0)) {
                            rows.push(currentRow);
                        }
                        currentRow = [];
                        i++;
                        continue;
                    }

                    currentField += char;
                    i++;
                }

                if (currentField.length > 0 || currentRow.length > 0) {
                    currentRow.push(currentField.trim());
                    if (currentRow.some(f => f.length > 0)) {
                        rows.push(currentRow);
                    }
                }

                if (rows.length === 0) {
                    throw new Error('未在 CSV 中偵測到有效資料列');
                }

                const cards = [];
                for (let rIndex = 0; rIndex < rows.length; rIndex++) {
                    const row = rows[rIndex];
                    const word = row[0] || '';
                    const content = row.slice(1).join('\n') || '';

                    if (word && word !== '單字') {
                        cards.push({
                            id: rIndex + 1,
                            word: word.trim(),
                            content: content.trim()
                        });
                    }
                }

                if (cards.length === 0) {
                    throw new Error('未能自 CSV 中成功解析出任何單字卡片');
                }

                return cards;
            }
        }

        /**
         * SRS 佇列引擎 (SrsEngine)
         */
        class SrsEngine {
            constructor(cards = []) {
                this.allCards = [...cards];
                this.queue = [...cards];
                this.stats = { again: 0, hard: 0, known: 0, easy: 0 };
                this.initialTotal = cards.length;
            }

            loadState(state) {
                if (!state) return;
                this.allCards = state.allCards || [];
                this.queue = state.queue || [];
                this.stats = state.stats || { again: 0, hard: 0, known: 0, easy: 0 };
                this.initialTotal = state.initialTotal || this.allCards.length;
            }

            getState() {
                return {
                    allCards: this.allCards,
                    queue: this.queue,
                    stats: this.stats,
                    initialTotal: this.initialTotal
                };
            }

            getCurrentCard() {
                return this.queue.length > 0 ? this.queue[0] : null;
            }

            isFinished() {
                return this.queue.length === 0;
            }

            processAnswer(action) {
                if (this.queue.length === 0) return;
                const current = this.queue.shift();

                switch (action) {
                    case 'again':
                        this.stats.again++;
                        if (this.queue.length >= 1) {
                            this.queue.splice(1, 0, current);
                        } else {
                            this.queue.push(current);
                        }
                        break;

                    case 'hard':
                        this.stats.hard++;
                        const mid = Math.floor(this.queue.length / 2);
                        this.queue.splice(mid, 0, current);
                        break;

                    case 'known':
                        this.stats.known++;
                        this.queue.push(current);
                        break;

                    case 'easy':
                        this.stats.easy++;
                        break;
                }
            }

            reset() {
                this.queue = [...this.allCards];
                this.stats = { again: 0, hard: 0, known: 0, easy: 0 };
                this.initialTotal = this.allCards.length;
            }
        }

        /**
         * Flashcard 主應用控制器 (FlashcardApp)
         */
        class FlashcardApp {
            constructor() {
                this.audio = new AudioService();
                this.storage = new StorageService();
                this.srs = new SrsEngine(DEFAULT_CARDS_DATA || []);
                this.currentFileName = '預設 TOEIC 題庫';
                this.isFlipped = false;
                this.theme = 'light';

                this.dom = {
                    flashcard: document.getElementById('flashcard'),
                    cardStage: document.getElementById('card-stage'),
                    frontWordText: document.getElementById('front-word-text'),
                    backWordTitle: document.getElementById('back-word-title'),
                    backContentBody: document.getElementById('back-content-body'),
                    cardDynamicImg: document.getElementById('card-dynamic-img'),
                    imgFallback: document.getElementById('img-fallback'),
                    frontSpeechBtn: document.getElementById('front-speech-btn'),
                    backSpeechBtn: document.getElementById('back-speech-btn'),
                    controlsToolbar: document.getElementById('controls-toolbar'),
                    queueCounter: document.getElementById('queue-counter'),
                    progressBar: document.getElementById('progress-bar'),
                    currentFilename: document.getElementById('current-filename'),
                    vocabCountBadge: document.getElementById('vocab-count-badge'),
                    completionView: document.getElementById('completion-view'),
                    statAgain: document.getElementById('stat-again'),
                    statHard: document.getElementById('stat-hard'),
                    statKnown: document.getElementById('stat-known'),
                    statEasy: document.getElementById('stat-easy'),
                    restartBtn: document.getElementById('restart-btn'),
                    importNewBtn: document.getElementById('import-new-btn'),
                    uploadBtn: document.getElementById('upload-btn'),
                    csvFileInput: document.getElementById('csv-file-input'),
                    resetBtn: document.getElementById('reset-btn'),
                    themeBtn: document.getElementById('theme-btn'),
                    helpBtn: document.getElementById('help-btn'),
                    helpModal: document.getElementById('help-modal'),
                    modalCloseBtn: document.getElementById('modal-close-btn'),
                    btnAgain: document.getElementById('btn-again'),
                    btnHard: document.getElementById('btn-hard'),
                    btnKnown: document.getElementById('btn-known'),
                    btnEasy: document.getElementById('btn-easy'),
                    toast: document.getElementById('toast')
                };
            }

            init() {
                this.bindEvents();
                this.render();

                this.storage.init().then(() => {
                    this.loadPersistedState().then(() => {
                        this.render();
                    });
                });
            }

            async loadPersistedState() {
                try {
                    const savedState = await this.storage.load('srs_flashcard_state');
                    if (savedState && savedState.srs && savedState.srs.allCards && savedState.srs.allCards.length > 0) {
                        this.srs.loadState(savedState.srs);
                        this.currentFileName = savedState.fileName || '預設 TOEIC 題庫';
                        this.theme = savedState.theme || 'light';
                    }
                    this.applyTheme(this.theme);
                } catch (e) {
                    console.warn('Load state error', e);
                }
            }

            async persistState() {
                const payload = {
                    srs: this.srs.getState(),
                    fileName: this.currentFileName,
                    theme: this.theme
                };
                await this.storage.save('srs_flashcard_state', payload);
            }

            bindEvents() {
                if (this.dom.flashcard) {
                    this.dom.flashcard.addEventListener('click', (e) => {
                        if (e.target.closest('.sound-btn')) return;
                        this.toggleFlip();
                    });
                }

                if (this.dom.frontSpeechBtn) {
                    this.dom.frontSpeechBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const card = this.srs.getCurrentCard();
                        if (card) this.audio.speak(card.word);
                    });
                }

                if (this.dom.backSpeechBtn) {
                    this.dom.backSpeechBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const card = this.srs.getCurrentCard();
                        if (card) {
                            const sentence = this.audio.extractEnglishSentence(card.content) || card.word;
                            this.audio.speak(sentence);
                        }
                    });
                }

                if (this.dom.btnAgain) this.dom.btnAgain.addEventListener('click', () => this.handleSrsAction('again'));
                if (this.dom.btnHard) this.dom.btnHard.addEventListener('click', () => this.handleSrsAction('hard'));
                if (this.dom.btnKnown) this.dom.btnKnown.addEventListener('click', () => this.handleSrsAction('known'));
                if (this.dom.btnEasy) this.dom.btnEasy.addEventListener('click', () => this.handleSrsAction('easy'));

                if (this.dom.restartBtn) {
                    this.dom.restartBtn.addEventListener('click', () => {
                        this.srs.reset();
                        this.isFlipped = false;
                        this.persistState();
                        this.render();
                        this.showToast('已重新開始學習！');
                    });
                }

                if (this.dom.csvFileInput) {
                    this.dom.csvFileInput.addEventListener('change', (e) => this.handleCsvUpload(e));
                }

                window.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    document.body.classList.add('drag-over');
                });

                window.addEventListener('dragleave', (e) => {
                    if (e.clientX === 0 || e.clientY === 0) {
                        document.body.classList.remove('drag-over');
                    }
                });

                window.addEventListener('drop', (e) => {
                    e.preventDefault();
                    document.body.classList.remove('drag-over');
                    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                        this.handleDroppedFile(e.dataTransfer.files[0]);
                    }
                });

                if (this.dom.resetBtn) {
                    this.dom.resetBtn.addEventListener('click', () => {
                        if (confirm('確定要重設當前學習進度嗎？')) {
                            this.srs.reset();
                            this.isFlipped = false;
                            this.persistState();
                            this.render();
                            this.showToast('學習進度已重設');
                        }
                    });
                }

                if (this.dom.themeBtn) {
                    this.dom.themeBtn.addEventListener('click', () => {
                        this.theme = this.theme === 'light' ? 'dark' : 'light';
                        this.applyTheme(this.theme);
                        this.persistState();
                    });
                }

                if (this.dom.helpBtn) {
                    this.dom.helpBtn.addEventListener('click', () => {
                        this.dom.helpModal.classList.add('active');
                    });
                }

                if (this.dom.modalCloseBtn) {
                    this.dom.modalCloseBtn.addEventListener('click', () => {
                        this.dom.helpModal.classList.remove('active');
                    });
                }

                if (this.dom.helpModal) {
                    this.dom.helpModal.addEventListener('click', (e) => {
                        if (e.target === this.dom.helpModal) {
                            this.dom.helpModal.classList.remove('active');
                        }
                    });
                }

                window.addEventListener('keydown', (e) => this.handleKeyDown(e));
            }

            handleKeyDown(e) {
                if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;

                if (e.code === 'Space') {
                    e.preventDefault();
                    this.toggleFlip();
                } else if (e.code === 'Enter') {
                    e.preventDefault();
                    this.playCurrentSpeech();
                } else if (e.key === '1') {
                    e.preventDefault();
                    this.handleSrsAction('again');
                } else if (e.key === '2') {
                    e.preventDefault();
                    this.handleSrsAction('hard');
                } else if (e.key === '3') {
                    e.preventDefault();
                    this.handleSrsAction('known');
                } else if (e.key === '4') {
                    e.preventDefault();
                    this.handleSrsAction('easy');
                }
            }

            toggleFlip() {
                if (this.srs.isFinished()) return;
                this.isFlipped = !this.isFlipped;
                this.updateCardFlipVisual();
                this.playCurrentSpeech();
            }

            updateCardFlipVisual() {
                if (!this.dom.flashcard) return;
                if (this.isFlipped) {
                    this.dom.flashcard.classList.add('is-flipped');
                } else {
                    this.dom.flashcard.classList.remove('is-flipped');
                }
            }

            playCurrentSpeech() {
                const card = this.srs.getCurrentCard();
                if (!card) return;
                if (!this.isFlipped) {
                    this.audio.speak(card.word);
                } else {
                    const sentence = this.audio.extractEnglishSentence(card.content) || card.word;
                    this.audio.speak(sentence);
                }
            }

            handleSrsAction(action) {
                if (this.srs.isFinished()) return;
                this.srs.processAnswer(action);
                this.isFlipped = false;
                this.updateCardFlipVisual();
                this.persistState();
                this.render();
                if (!this.srs.isFinished()) {
                    this.playCurrentSpeech();
                }
            }

            async handleCsvUpload(event) {
                const file = event.target.files[0];
                if (!file) return;
                await this.handleDroppedFile(file);
                event.target.value = '';
            }

            async handleDroppedFile(file) {
                if (!file) return;
                try {
                    const text = await file.text();
                    const parsedCards = CsvParserService.parse(text);
                    this.srs = new SrsEngine(parsedCards);
                    this.currentFileName = file.name;
                    this.isFlipped = false;
                    await this.persistState();
                    this.render();
                    this.showToast(`成功匯入 ${parsedCards.length} 筆單字！`);
                } catch (err) {
                    alert(`CSV 匯入失敗：${err.message}`);
                }
            }

            applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
            }

            showToast(msg) {
                if (!this.dom.toast) return;
                this.dom.toast.textContent = msg;
                this.dom.toast.classList.add('show');
                setTimeout(() => {
                    this.dom.toast.classList.remove('show');
                }, 2200);
            }

            render() {
                if (!this.dom.currentFilename) return;
                this.dom.currentFilename.textContent = this.currentFileName;
                this.dom.vocabCountBadge.textContent = `${this.srs.allCards.length} 字`;

                if (this.srs.isFinished()) {
                    if (this.dom.flashcard) this.dom.flashcard.style.display = 'none';
                    if (this.dom.completionView) this.dom.completionView.style.display = 'flex';
                    if (this.dom.controlsToolbar) {
                        this.dom.controlsToolbar.style.opacity = '0.4';
                        this.dom.controlsToolbar.style.pointerEvents = 'none';
                    }

                    if (this.dom.statAgain) this.dom.statAgain.textContent = this.srs.stats.again;
                    if (this.dom.statHard) this.dom.statHard.textContent = this.srs.stats.hard;
                    if (this.dom.statKnown) this.dom.statKnown.textContent = this.srs.stats.known;
                    if (this.dom.statEasy) this.dom.statEasy.textContent = this.srs.stats.easy;

                    if (this.dom.queueCounter) this.dom.queueCounter.textContent = '學習完畢';
                    if (this.dom.progressBar) this.dom.progressBar.style.width = '100%';
                    return;
                }

                if (this.dom.flashcard) this.dom.flashcard.style.display = 'block';
                if (this.dom.completionView) this.dom.completionView.style.display = 'none';
                if (this.dom.controlsToolbar) {
                    this.dom.controlsToolbar.style.opacity = '1';
                    this.dom.controlsToolbar.style.pointerEvents = 'auto';
                }

                const card = this.srs.getCurrentCard();
                if (!card) return;

                if (this.dom.frontWordText) this.dom.frontWordText.textContent = card.word;
                if (this.dom.backWordTitle) this.dom.backWordTitle.textContent = card.word;
                this.renderBackContent(card.content);
                this.updateCardImage(card.word);

                const remaining = this.srs.queue.length;
                const total = this.srs.initialTotal || this.srs.allCards.length;
                const done = Math.max(0, total - remaining);
                const percent = Math.min(100, Math.round((done / total) * 100));

                if (this.dom.queueCounter) this.dom.queueCounter.textContent = `剩餘: ${remaining} / 總計: ${total}`;
                if (this.dom.progressBar) this.dom.progressBar.style.width = `${percent}%`;

                this.updateCardFlipVisual();
            }

            updateCardImage(word) {
                if (!this.dom.cardDynamicImg) return;
                const cleanWord = encodeURIComponent(word.toLowerCase().replace(/[^a-z0-9]/g, ''));
                const imgUrl = `https://loremflickr.com/600/380/${cleanWord}?lock=${cleanWord.length * 17}`;
                
                this.dom.cardDynamicImg.style.display = 'block';
                if (this.dom.imgFallback) this.dom.imgFallback.style.display = 'none';
                this.dom.cardDynamicImg.src = imgUrl;
            }

            renderBackContent(rawContent) {
                if (!this.dom.backContentBody) return;
                if (!rawContent) {
                    this.dom.backContentBody.innerHTML = '<p style="color: var(--text-muted);">無詳細內容</p>';
                    return;
                }

                const lines = rawContent.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                const htmlParts = [];

                let currentSection = '';
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];

                    if (line.startsWith('【詞性變化】')) {
                        currentSection = 'forms';
                        htmlParts.push('<span class="section-tag">【詞性變化】</span>');
                    } else if (line.startsWith('【搭配詞】')) {
                        currentSection = 'colloc';
                        htmlParts.push('<span class="section-tag">【搭配詞】</span>');
                    } else if (line.startsWith('【例句】')) {
                        currentSection = 'example';
                        htmlParts.push('<span class="section-tag">【例句】</span>');
                    } else {
                        if (i === 0 && !line.startsWith('【')) {
                            htmlParts.push(`<div class="section-header-line">${this.escapeHtml(line)}</div>`);
                        } else if (currentSection === 'example') {
                            const enMatch = line.match(/^([^()（）]+)(?:[\(（](.+)[\\)）])?/);
                            if (enMatch) {
                                const enText = enMatch[1].trim();
                                const zhText = enMatch[2] ? enMatch[2].trim() : '';
                                htmlParts.push(`
                                    <div class="example-block">
                                        <span class="example-en">${this.escapeHtml(enText)}</span>
                                        ${zhText ? `<span class="example-zh">(${this.escapeHtml(zhText)})</span>` : ''}
                                    </div>
                                `);
                            } else {
                                htmlParts.push(`<div class="section-text">${this.escapeHtml(line)}</div>`);
                            }
                        } else {
                            htmlParts.push(`<div class="section-text">${this.escapeHtml(line)}</div>`);
                        }
                    }
                }

                this.dom.backContentBody.innerHTML = htmlParts.join('');
            }

            escapeHtml(str) {
                return str
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            try {
                window.app = new FlashcardApp();
                window.app.init();
            } catch (e) {
                console.error('App init error:', e);
            }
        });
    </script>
