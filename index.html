<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRS 單字學習 Flash Card</title>
    <!-- 現代字體支援 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-card-back: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --card-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --again-color: #dc2626;
            --again-bg: #fef2f2;
            --again-border: #fecaca;
            --hard-color: #d97706;
            --hard-bg: #fffbeb;
            --hard-border: #fde68a;
            --known-color: #0284c7;
            --known-bg: #f0f9ff;
            --known-border: #bae6fd;
            --easy-color: #059669;
            --easy-bg: #ecfdf5;
            --easy-border: #a7f3d0;
            --radius-lg: 16px;
            --radius-md: 10px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-main: #0b0f19;
            --bg-card: #151d30;
            --bg-card-back: #131b2c;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: #222f49;
            --card-shadow: 0 15px 30px -8px rgba(0, 0, 0, 0.6);
            --again-bg: #2b1417;
            --again-border: #7f1d1d;
            --hard-bg: #2b2111;
            --hard-border: #78350f;
            --known-bg: #0f243d;
            --known-border: #0369a1;
            --easy-bg: #0c271e;
            --easy-border: #047857;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.75rem;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* 主容器：固定視窗高度，防止任何塌陷 */
        .app-container {
            width: 100%;
            max-width: 540px;
            height: 100%;
            max-height: 860px;
            min-height: 540px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 0.75rem;
        }

        /* 頂部導航列 */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.25rem 0.2rem;
            flex-shrink: 0;
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.45rem;
            color: var(--text-primary);
        }

        .brand-badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.18rem 0.45rem;
            border-radius: 9999px;
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            border: 1px solid rgba(37, 99, 235, 0.2);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .icon-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
            user-select: none;
        }

        .icon-btn:hover {
            color: var(--text-primary);
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        /* 隱藏的檔案輸入框 */
        .visually-hidden-input {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
            opacity: 0;
        }

        /* 進度條與狀態 */
        .progress-section {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            flex-shrink: 0;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .file-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            max-width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background-color: var(--border-color);
            border-radius: 9999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #60a5fa);
            border-radius: 9999px;
            transition: width 0.35s ease;
        }

        /* 卡片舞臺區域（完整自適應高度，絕不塌陷） */
        .card-stage {
            perspective: 1200px;
            width: 100%;
            flex: 1 1 auto;
            min-height: 380px;
            position: relative;
            display: flex;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.45s cubic-bezier(0.2, 0.85, 0.4, 1.1);
            cursor: pointer;
            border-radius: var(--radius-lg);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--card-shadow);
            overflow-y: auto;
            scrollbar-width: thin;
        }

        /* 卡片正面：乾淨大字與垂直置中 */
        .card-front {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            text-align: center;
        }

        .front-top-toolbar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .sound-btn {
            background: rgba(37, 99, 235, 0.08);
            border: 1px solid rgba(37, 99, 235, 0.2);
            color: var(--primary);
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.82rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .sound-btn:hover {
            background: rgba(37, 99, 235, 0.16);
            transform: scale(1.03);
        }

        .front-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            margin: auto 0;
            padding: 1rem 0;
        }

        .front-word {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            line-height: 1.2;
            word-break: break-word;
        }

        .front-hint {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .key-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            padding: 0.12rem 0.4rem;
            background: var(--border-color);
            color: var(--text-secondary);
            border-radius: 5px;
            font-weight: 700;
        }

        /* 卡片背面：結構化排版（與圖片完全一致） */
        .card-back {
            transform: rotateY(180deg);
            background: var(--bg-card-back);
            display: flex;
            flex-direction: column;
            padding: 1.25rem 1.4rem;
            gap: 0.65rem;
        }

        .back-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            flex-shrink: 0;
        }

        .back-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* 示意圖片縮圖（完整呈現不裁切） */
        .card-image-wrap {
            width: 100%;
            height: 175px;
            max-height: 190px;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #0f172a;
            position: relative;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 完整呈現整張圖片，絕不裁切頂部或邊緣 */
            display: block;
        }

        .image-fallback {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
        }

        /* 背面內文區塊 */
        .back-content {
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            font-size: 0.92rem;
            line-height: 1.5;
            color: var(--text-primary);
        }

        .section-header-line {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .section-tag {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--primary);
            margin-top: 0.2rem;
            display: block;
        }

        .section-text {
            color: var(--text-secondary);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .example-block {
            background: rgba(37, 99, 235, 0.05);
            border-left: 3px solid var(--primary);
            padding: 0.5rem 0.75rem;
            border-radius: 0 6px 6px 0;
            font-size: 0.88rem;
            line-height: 1.45;
        }

        .example-en {
            font-weight: 600;
            color: var(--text-primary);
            display: block;
            margin-bottom: 0.15rem;
        }

        .example-zh {
            color: var(--text-secondary);
        }

        /* 底部 SRS 4 鍵工具列 */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            width: 100%;
            flex-shrink: 0;
        }

        .srs-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.65rem 0.25rem;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .srs-btn:hover {
            transform: translateY(-2px);
            filter: brightness(0.96);
        }

        .srs-btn:active {
            transform: translateY(1px);
        }

        .btn-title {
            font-size: 0.92rem;
            font-weight: 700;
        }

        .btn-sub {
            font-size: 0.72rem;
            opacity: 0.85;
            margin-top: 0.05rem;
        }

        .btn-key {
            font-size: 0.68rem;
            font-family: 'JetBrains Mono', monospace;
            opacity: 0.6;
            margin-top: 0.2rem;
        }

        .btn-again {
            background-color: var(--again-bg);
            color: var(--again-color);
            border-color: var(--again-border);
        }

        .btn-hard {
            background-color: var(--hard-bg);
            color: var(--hard-color);
            border-color: var(--hard-border);
        }

        .btn-known {
            background-color: var(--known-bg);
            color: var(--known-color);
            border-color: var(--known-border);
        }

        .btn-easy {
            background-color: var(--easy-bg);
            color: var(--easy-color);
            border-color: var(--easy-border);
        }

        /* 完成畫面 */
        .completion-card {
            display: none;
            width: 100%;
            height: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--card-shadow);
            padding: 2rem 1.5rem;
            text-align: center;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
        }

        .completion-icon {
            font-size: 3rem;
            line-height: 1;
        }

        .completion-title {
            font-size: 1.5rem;
            font-weight: 800;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.6rem;
            width: 100%;
            max-width: 320px;
        }

        .stat-box {
            padding: 0.75rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-num {
            font-size: 1.4rem;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-label {
            font-size: 0.72rem;
            color: var(--text-secondary);
            font-weight: 600;
            margin-top: 0.15rem;
        }

        .completion-actions {
            display: flex;
            gap: 0.75rem;
            width: 100%;
            max-width: 320px;
            margin-top: 0.25rem;
        }

        .primary-btn, .secondary-btn {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .primary-btn {
            background: var(--primary);
            color: #ffffff;
        }

        .primary-btn:hover {
            background: var(--primary-hover);
        }

        .secondary-btn {
            background: var(--bg-card);
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        .secondary-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Toast 提示 */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #0f172a;
            color: #ffffff;
            padding: 0.65rem 1.2rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Modal 彈窗 */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-backdrop.active {
            display: flex;
        }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            max-width: 400px;
            width: 100%;
            box-shadow: var(--card-shadow);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .modal-close {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .shortcut-list {
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .shortcut-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 拖曳高亮 */
        body.drag-over .card-stage {
            outline: 3px dashed var(--primary);
            outline-offset: 4px;
            border-radius: var(--radius-lg);
        }

        /* 手機自適應 */
        @media (max-width: 600px) {
            body {
                padding: 0.5rem;
            }
            .front-word {
                font-size: 2.4rem;
            }
            .srs-btn {
                padding: 0.55rem 0.15rem;
            }
            .btn-title {
                font-size: 0.82rem;
            }
            .btn-sub {
                font-size: 0.68rem;
            }
            .card-back {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 頂部導航列 -->
        <header class="app-header">
            <div class="brand-title">
                <span>🧠 SRS Flashcard</span>
                <span class="brand-badge" id="vocab-count-badge">TOEIC</span>
            </div>
            <div class="header-actions">
                <!-- 原生 label 觸發檔案選擇器 -->
                <input type="file" id="csv-file-input" class="visually-hidden-input" accept=".csv,text/csv">
                <label for="csv-file-input" class="icon-btn" id="upload-btn" title="匯入 CSV 單字檔案">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                </label>
                <button class="icon-btn" id="reset-btn" title="重設學習進度">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                </button>
                <button class="icon-btn" id="theme-btn" title="切換深色/淺色主題">
                    <svg id="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                </button>
                <button class="icon-btn" id="help-btn" title="快速鍵說明">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                </button>
            </div>
        </header>

        <!-- 進度指示條 -->
        <section class="progress-section">
            <div class="status-bar">
                <span class="file-tag" id="file-label">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    <span id="current-filename">預設 TOEIC 題庫</span>
                </span>
                <span id="queue-counter">剩餘: 0 / 總計: 0</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-bar"></div>
            </div>
        </section>

        <!-- 閃卡主舞臺（佔滿中央區域） -->
        <main class="card-stage" id="card-stage">
            <div class="card" id="flashcard">
                <!-- 正面 -->
                <div class="card-face card-front">
                    <div class="front-top-toolbar">
                        <button class="sound-btn" id="front-speech-btn" title="朗讀單字">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                            朗讀
                        </button>
                    </div>
                    <div class="front-main">
                        <h1 class="front-word" id="front-word-text">Loading...</h1>
                    </div>
                    <div class="front-hint">
                        點擊卡片或按 <span class="key-badge">Space</span> 翻面
                    </div>
                </div>

                <!-- 背面 -->

    <script>
        const DEFAULT_CARDS_DATA = [{"id": 1, "word": "abandon", "content": "abandon (v.) 拋棄、遺棄、放棄（計畫、責任等）\n【搭配詞】\nabandon a project 放棄專案\nabandon a plan 放棄計畫\n【例句】\nThe company decided to abandon the project due to budget constraints. (由於預算限制，公司決定放棄這個專案。)"}, {"id": 2, "word": "abandoned", "content": "abandoned (adj.) 被遺棄的、廢棄的、（計畫、項目等）被擱置的\n【搭配詞】\nabandoned building 廢棄建築\nabandoned vehicle 廢棄車輛\n【例句】\nThe project was abandoned due to budget cuts and lack of resources. (由於預算削減和資源不足，該項目被擱置。)"}, {"id": 3, "word": "abate", "content": "abate (v.) （風、雨、疼痛等）減弱，緩和\n【例句】\nThe storm is expected to abate by tomorrow morning. (預計明天早上風暴會減弱。)"}, {"id": 4, "word": "abbreviate", "content": "abbreviate (v.) 縮寫、簡略化（表達方式）\n【例句】\nTo save space, we often abbreviate company names in internal memos. (為了節省空間，我們經常在內部備忘錄中縮寫公司名稱。)"}, {"id": 5, "word": "abdomen", "content": "abdomen (n.) 腹部、肚子\n【搭配詞】\nabdominal pain 腹部疼痛\nabdominal examination 腹部檢查\n【例句】\nThe doctor pressed lightly on the patient's abdomen. (醫生輕輕按壓了病人的腹部。)"}, {"id": 6, "word": "abdominal", "content": "abdominal (adj.) 腹部的、與腹部相關的\n【詞性變化】\nabdomen (n.) 腹部\n【搭配詞】\nabdominal pain 腹痛\nabdominal muscles 腹肌，簡稱 abs\n【例句】\nThe employee reported experiencing abdominal discomfort and requested a medical leave. (這位員工報告稱腹部不適，並要求病假。)"}, {"id": 7, "word": "abductor", "content": "abductor (n.) 綁架者、誘拐者\n【詞性變化】\nabduct (v.) 綁架/使外展\n【搭配詞】\nalleged abductor 涉嫌綁架者\nidentify the abductor 確認綁架者身分\n【例句】\nPolice are searching for the abductor of the missing child. (警方正在搜尋失蹤兒童的綁架者。)"}, {"id": 8, "word": "abide", "content": "abide (v.) 忍受、遵守（規則、協議等）\n【例句】\nAll employees must abide by the company's code of conduct. (所有員工都必須遵守公司的行為準則。)"}, {"id": 9, "word": "abilities", "content": "abilities (n.) 能力、技能\n【搭配詞】\ndemonstrate abilities 展現能力\ntechnical abilities 技術能力\n【例句】\nThe company is looking for candidates with strong communication abilities. (公司正在尋找具備良好溝通能力的候選人。)"}, {"id": 10, "word": "ability", "content": "ability (n.) 能力、才能\n【搭配詞】\ndemonstrate/show ability 展現能力\nexceptional ability 卓越的能力\n【例句】\nThe candidate's ability to manage projects effectively impressed the hiring manager. (這位候選人有效管理專案的能力讓招聘經理印象深刻。)"}, {"id": 11, "word": "able", "content": "able (adj., adv.) 有能力、能夠、勝任\n【詞性變化】\nenable (v.) 使...能夠\nability (n.) 能力\n【例句】\nThe candidate is able to manage multiple projects simultaneously. (這位候選人能夠同時管理多個專案。)"}, {"id": 12, "word": "aboard", "content": "aboard (adv., prep.) 登上（船、飛機、火車等）、在船、飛機、火車等上面\n【搭配詞】\ngo aboard 上船/飛機\nall aboard 請大家上船/車\n【例句】\nAll passengers are requested to board the flight immediately. (請所有乘客立即登上飛機。)"}, {"id": 13, "word": "abolish", "content": "abolish (v.) 廢除、取消（法律、制度等）\n【搭配詞】\nabolish a law 廢除法律\nabolish a system 廢除制度\n【例句】\nThe company decided to abolish the outdated policy to improve efficiency. (為了提高效率，公司決定廢除過時的政策。)"}, {"id": 14, "word": "abort", "content": "abort (v.) 中止、取消（計畫、程序等）\n【例句】\nThe project was aborted due to unforeseen budget cuts. (由於預算削減，該專案被中止。)"}, {"id": 15, "word": "abortion", "content": "abortion (n.) 墮胎、中止、流產\n【搭配詞】\nperform an abortion 施行墮胎\nabortion rights 墮胎權\n【例句】\nThe debate over abortion rights is a complex social and ethical issue. (關於墮胎權的辯論是一個複雜的社會與倫理議題。)"}, {"id": 16, "word": "about", "content": "about (prep., adv.) 關於、大約、在…周圍、即將\n【例句】\nThe meeting is about the new marketing strategy. (這次會議是關於新的行銷策略。)"}, {"id": 17, "word": "above", "content": "above (prep., adv., adj., n.) 在...上方、高於、超過（數量、程度）、優於、上述的、在上方\n【例句】\nThe temperature is expected to rise above 30 degrees Celsius today. (今天氣溫預計會升至攝氏30度以上。)"}, {"id": 18, "word": "abramson", "content": "abramson (n.) 艾布拉姆森 (Abramson) 通常指一家律師事務所或其合夥人，在商務情境中，可能涉及法律諮詢、合同審閱等服務\n【例句】\nOur company retained Abramson & Associates to review the merger agreement. (我們聘請了艾布拉姆森律師事務所來審閱併購協議。)"}, {"id": 19, "word": "abridgment", "content": "abridgment (n.) 簡略版、縮寫版（通常指書籍、文件等內容被縮短後的版本）\n【搭配詞】\nan abridgment of the original contract 原始合約的節本\n【例句】\nThe editor provided an abridgment of the lengthy report for the executive summary. (編輯為執行摘要提供了這份冗長報告的簡略版。)"}, {"id": 20, "word": "abroad", "content": "abroad (adv., prep.) 在國外、在海外\n【搭配詞】\nproducts imported from abroad 從國外進口的產品\n【例句】\nThe company is expanding its operations abroad. (該公司正在海外擴展業務。)"}, {"id": 21, "word": "abruptly", "content": "abruptly (adv.) 突然地、驟然地\n【搭配詞】\nend abruptly 突然結束\nchange abruptly 突然改變\n【例句】\nThe meeting was abruptly canceled due to unforeseen circumstances. (由於突發狀況，會議突然被取消。)"}, {"id": 22, "word": "abs", "content": "abs (n.) 絕對值、總數\n【搭配詞】\ntone your abs 鍛鍊腹肌\nabs routine 腹肌訓練程序\n【例句】\nThe company reported a significant increase in absolute sales figures for the quarter. (該公司報告了本季的絕對銷售額顯著增加。)"}, {"id": 23, "word": "absence", "content": "absence (n.) 缺席、不在場\n【例句】\nDue to his absence from the meeting, Mr. Lee missed the crucial decision. (由於李先生缺席會議，他錯過了重要的決策。)"}, {"id": 24, "word": "absent", "content": "absent (adj., adv.) 缺席的、不在場的、缺勤的\n【詞性變化】\nabsence (n.) ：缺席\n【搭配詞】\npresent 出席\nmissing 失蹤、遺失\n【例句】\nThe employee was absent from the meeting due to a family emergency. (這位員工因家裡突發狀況缺席會議。)"}, {"id": 25, "word": "absolute", "content": "absolute (adj., adv.) 絕對的、完全的、無可爭議的\n【搭配詞】\nabsolute necessity 絕對必要\nabsolute minimum/maximum 絕對最小值/最大值\n【例句】\nThe company has an absolute commitment to providing high-quality products. (公司對提供高品質產品有絕對的承諾。)"}, {"id": 26, "word": "absolutely", "content": "absolutely (adv.) 完全地、絕對地\n【搭配詞】\nabsolutely necessary 絕對必要\nabsolutely essential 絕對關鍵\n【例句】\nI absolutely agree with your proposal to streamline the workflow. (我完全同意你簡化工作流程的建議。)"}, {"id": 27, "word": "absorb", "content": "absorb (v.) 吸收、接收（資訊、知識、衝擊等）、（材料）吸收（液體、熱量等）\n【搭配詞】\nbe absorbed in 全神貫注於...\n【例句】\nThe company needs to absorb the new regulations into its operational procedures. (公司需要將新的法規納入其營運程序。)"}, {"id": 28, "word": "absorbing", "content": "absorbing (adj.) 引人入勝的、吸引人的、吸收的\n【搭配詞】\nabsorbing task 引人入勝的任務\nabsorbing book 令人著迷的書\n【例句】\nThe training seminar was so absorbing that many participants stayed late to continue learning. (這項訓練課程非常引人入勝，許多參與者為了繼續學習而留到很晚。)"}, {"id": 29, "word": "absorption", "content": "absorption (n.) 吸收、全神貫注、併購\n【詞性變化】\nabsorb (v.)\nabsorbent (adj.)\n【例句】\nThe absorption of the smaller company into the large corporation boosted their market share. (較小的公司被大企業併購後，提升了他們的市場佔有率。)"}, {"id": 30, "word": "abstract", "content": "abstract (adj., n.) 抽象的、概括的、不具體的、概念性的\n【例句】\nThe report contains some abstract ideas that require further clarification. (這份報告包含一些需要進一步澄清的抽象概念。)"}, {"id": 31, "word": "abundant", "content": "abundant (adj.) 豐富的、大量的、充沛的\n【搭配詞】\nabundant supply 供應充足\nabundant evidence 證據確鑿\n【例句】\nThe company has abundant resources to invest in new technologies. (公司擁有充足的資源來投資新技術。)"}, {"id": 32, "word": "abundantly", "content": "abundantly (adv.) 充裕地、大量地、豐富地\n【搭配詞】\nmake it abundantly clear 使其非常清楚/顯而易見\n【例句】\nThe company has resources abundantly available to support the new project. (公司擁有大量資源來支持新專案。)"}, {"id": 33, "word": "abuse", "content": "abuse (v., n.) 濫用、不當利用、虐待（權力、資源等）\n【搭配詞】\nsubstance abuse 藥物/成癮物質濫用\nabuse of authority/power 濫用職權\n【例句】\nThe company has a strict policy against the abuse of company resources. (公司對公司資源的濫用有嚴格的政策。)"}, {"id": 34, "word": "abused", "content": "abused (v., adj.) 遭受虐待或不當對待、被濫用（資源、權力等）\n【搭配詞】\nsubstance abuse 物質濫用/藥物濫用\n【例句】\nThe company is investigating allegations that employees were abused by a supervisor. (公司正在調查關於員工被主管虐待的指控。)"}, {"id": 35, "word": "abusing", "content": "abusing (v.) 濫用、不當利用（資源、權力等）\n【搭配詞】\nabuse of power 濫用權力\nabusing company resources 濫用公司資源\n【例句】\nThe company has a strict policy against employees abusing their expense accounts. (公司對員工濫用費用報銷帳戶有嚴格的政策。)"}, {"id": 36, "word": "academic", "content": "academic (adj.) 與學術相關的、學術性的\n【詞性變化】\nacademy (n.) ：學院\n【搭配詞】\nacademic background 學術背景\nacademic credentials 學位證明/資歷\n【例句】\nThe conference focused on academic research in the field of artificial intelligence. (這次會議的重點是人工智慧領域的學術研究。)"}, {"id": 37, "word": "accelerate", "content": "accelerate (v.) 加速、加快（速度、進度等）\n【搭配詞】\naccelerate growth 加速增長\naccelerate the process 加速過程\n【例句】\nThe company needs to accelerate its product development to stay competitive. (為了保持競爭力，公司需要加速其產品開發進度。)"}, {"id": 38, "word": "acceleration", "content": "acceleration (n.) 加速、促進\n【搭配詞】\nacceleration in economic growth 經濟成長加速\nacceleration of the schedule 進度提前\n【例句】\nThe department implemented innovative acceleration procedures to improve operational efficiency. (部門實施創新的acceleration程序以提高營運效率。)"}, {"id": 39, "word": "accent", "content": "accent (n.) 口音、語調\n【搭配詞】\nstrong accent 口音很重\nslight accent 輕微口音\n【例句】\nDespite his slight American accent, he speaks fluent Mandarin. (儘管他帶有一點美國口音，但他講流利的普通話。)"}, {"id": 40, "word": "accept", "content": "accept (v.) 接受、同意、答允\n【搭配詞】\naccept an offer 接受提議/錄取\naccept responsibility 承擔責任\n【例句】\nThe company will accept credit card payments from now on. (從現在開始，公司將接受信用卡付款。)"}, {"id": 41, "word": "acceptable", "content": "acceptable (adj.) 可接受的、令人滿意的（通常指符合標準或期望）\n【例句】\nThe project proposal was deemed acceptable by the board of directors. (該專案提案已獲得董事會的批准。)"}, {"id": 42, "word": "acceptance", "content": "acceptance (n.) 接受、同意、批准\n【搭配詞】\nletter of acceptance 錄取通知書/接受函\nacceptance of an offer 接受提議\n【例句】\nWe are awaiting formal acceptance of the contract from the vendor. (我們正在等待供應商正式接受合約。)"}, {"id": 43, "word": "accepted", "content": "accepted (adj.) 被接受、同意、批准\n【搭配詞】\nwidely accepted 廣泛被接受的\nbe accepted into/by 被某組織或人接受\n【例句】\nThe proposal was accepted by the board of directors. (該提案已獲得董事會的批准。)"}, {"id": 44, "word": "accepting", "content": "accepting (adj., v.) 接受、同意、容納\n【搭配詞】\nNow accepting applications 現正接受申請\naccepting entries 接受參賽作品\n【例句】\nThe company is accepting applications for the marketing manager position until the end of the month. (公司將接受市場經理職位的申請，截止日期為本月底。)"}, {"id": 45, "word": "access", "content": "access (n., v.) 存取、接近權限、進入權限\n【搭配詞】\ngain access to 獲得權限\nunauthorized access 未經授權的存取\n【例句】\nEmployees need to access the company's database to retrieve sales figures. (員工需要存取公司資料庫以取得銷售數據。)"}, {"id": 46, "word": "accessibility", "content": "accessibility (n.) 可及性\n【搭配詞】\naccessibility to public transport 大眾運輸的便利性\nimprove 改善\n【例句】\nThe company is committed to improving the accessibility of its website for users with disabilities. (公司致力於提升其網站的可及性，以方便身心障礙人士使用。)"}, {"id": 47, "word": "accessible", "content": "accessible (adj.) 易於取得或使用的、可進入的、可負擔的\n【例句】\nThe company website is designed to be accessible to users with disabilities. (該公司網站的設計旨在方便身心障礙人士使用。)"}, {"id": 48, "word": "accessories", "content": "accessories (n.) 配飾、附加品（通常指服裝、包袋等用於裝飾或搭配的物品）\n【搭配詞】\ncomputer accessories 電腦配件\nfashion accessories 時尚飾品\n【例句】\nThe boutique offers a wide range of accessories, including scarves, belts, and jewelry. (這家精品店提供各式各樣的配飾，包括圍巾、皮帶和珠寶。)"}, {"id": 49, "word": "accessory", "content": "accessory (n., adj.) 配件、附件、從犯、附屬的、輔助的\n【搭配詞】\ncomputer accessories 電腦配件\nfashion accessories 時尚配件\n【例句】\nThe store offers a wide range of car accessories, from seat covers to navigation systems. (這家商店提供各種汽車配件，從座套到導航系統一應俱全。)"}, {"id": 50, "word": "accident", "content": "accident (n.) 意外事故、意外事件\n【詞性變化】\naccidental (adj.) 意外的\naccidentally (adv.) 不小心地\n【搭配詞】\nby accident 偶然地\nindustrial accident 工安意外\n【例句】\nThe company is investigating the accident to determine the cause and prevent future incidents. (公司正在調查這起意外事故，以確定原因並防止未來發生類似事件。)"}, {"id": 51, "word": "accidentally", "content": "accidentally (adv.) 不小心地、意外地（指因疏忽或未經意間發生的事情）\n【搭配詞】\naccidentally deleted 意外刪除文件\naccidentally omitted 不小心遺漏內容\n【例句】\nI accidentally deleted the important file; I'm so sorry. (我不小心刪除了重要的檔案，我非常抱歉。)"}, {"id": 52, "word": "acclaim", "content": "acclaim (v., n.) 讚譽、好評、盛讚\n【搭配詞】\ncritically acclaimed 深受好評的\ninternational/universal acclaim 國際/一致好評\n【例句】\nThe new product received widespread acclaim from industry experts. (這款新產品獲得了業界專家們的廣泛讚譽。)"}, {"id": 53, "word": "accommodate", "content": "accommodate (v.) 容納、適應、滿足（需求或要求）\n【搭配詞】\naccommodate the growing demand 滿足日益增長的需求\naccommodate a busy schedule 配合繁忙的日程\n【例句】\nThe hotel can accommodate up to 200 guests for the conference. (這家飯店可以容納最多 200 位嘉賓參加會議。)"}, {"id": 54, "word": "accommodation", "content": "accommodation (n.) 住宿、膳宿安排、（公司提供的）住宿福利\n【例句】\nThe company provides accommodation and meals for all overseas employees. (公司為所有海外員工提供住宿和膳食。)"}, {"id": 55, "word": "accommodations", "content": "accommodations (n.) 住宿設施或提供的住宿服務，常指旅館、酒店或其他供應客人暫住的場所\n【搭配詞】\nprovide accommodations 提供住宿\nseek accommodations 尋找住宿\n【例句】\nThe conference organizer arranged accommodations at a nearby hotel for all attendees. (會議主辦單位為所有與會者安排了附近飯店的住宿。)"}, {"id": 56, "word": "accompanied", "content": "accompanied (v.) 伴隨、隨同、與...同時發生\n【搭配詞】\naccompanied 被動語態/過去分詞\nthe accompanying manual 隨附的手冊\n【例句】\nThe sales representative was accompanied by a technical expert during the client meeting. (銷售代表在客戶會議期間與一位技術專家一同出席。)"}, {"id": 57, "word": "accompany", "content": "accompany (v.) 陪伴、隨同、伴隨\n【例句】\nThe marketing team will accompany the CEO on the business trip to Tokyo. (行銷團隊將陪同 CEO 前往東京進行商務旅行。)"}, {"id": 58, "word": "accomplish", "content": "accomplish (v.) 完成、達成（目標、任務等）\n【搭配詞】\naccomplish a task 完成任務\naccomplish a goal 達成目標\n【例句】\nThe project team managed to accomplish all the objectives within the deadline. (專案團隊成功在期限內完成了所有目標。)"}, {"id": 59, "word": "accomplished", "content": "accomplished (adj.) （尤指在某方面）有成就的、技藝精湛的\n【詞性變化】\naccomplishment (n.) 成就\naccomplish (v.) 完成\n【例句】\nThe company is proud to have an accomplished sales team that consistently exceeds targets. (公司很自豪擁有一支技藝精湛的銷售團隊，他們始終能超越目標。)"}, {"id": 60, "word": "accomplishment", "content": "accomplishment (n.) 成就、完成\n【詞性變化】\naccomplished (adj.) 形容人有才華的或精通的\n【搭配詞】\nremarkable accomplishment 卓越的成就\nsense of accomplishment 成就感\n【例句】\nThe department implemented innovative accomplishment procedures to improve operational efficiency. (部門實施創新的accomplishment程序以提高營運效率。)"}, {"id": 61, "word": "accord", "content": "accord (n., v., adj.) 一致、協調、達成協議\n【搭配詞】\naccord 協議/一致\naccording to 根據\n【例句】\nThe two companies reached an accord on the terms of the merger. (這兩家公司就合併條款達成一致。)"}, {"id": 62, "word": "accordance", "content": "accordance (prep., adv.) 依照、符合、根據\n【例句】\nThe company operates in accordance with all relevant regulations. (公司依照所有相關法規運作。)"}, {"id": 63, "word": "according", "content": "according (adv., prep.) 根據、依照、根據…的\n【詞性變化】\naccordingly (adv.)\n【搭配詞】\naccording to the revised schedule 根據修改後的進度表\naccording to 介係詞片語\n【例句】\nThe project timeline is according to the client's specifications. (專案時間表依照客戶的規格。)"}, {"id": 64, "word": "accordingly", "content": "accordingly (adv.) 相應地、根據地、適當地\n【搭配詞】\nplan accordingly 相應地計畫\nact accordingly 採取相應行動\n【例句】\nThe meeting was postponed until next week, and the project timeline was adjusted accordingly. (會議延遲至下週舉行，專案時程也相應地調整。)"}, {"id": 65, "word": "account", "content": "account (n., v.) 帳戶、紀錄、說明、負責人\n【詞性變化】\naccountable (adj.) 應負責任的\n【搭配詞】\ntake something into account 將某事考慮在內\non account of 因為，等同於 because of\n【例句】\nThe company needs to reconcile its bank accounts monthly. (公司需要每月對帳戶進行核對。)"}, {"id": 66, "word": "accountability", "content": "accountability (n.) 責任制\n【搭配詞】\nhold someone accountable for something 要求某人對某事負責\npersonal accountability 個人當責\n【例句】\nThe company's new accountability initiative exceeded expectations in the first quarter. (公司的新accountability計畫在第一季度超出了預期。)"}, {"id": 67, "word": "accountable", "content": "accountable (adj., v.) 負責、對...負責、可追溯的\n【搭配詞】\nbe held accountable for 為某事負責\n【例句】\nEach department is accountable for meeting its quarterly sales targets. (每個部門都需對達成季度銷售目標負責。)"}, {"id": 68, "word": "accountant", "content": "accountant (n.) 會計師、負責公司財務帳務處理的人員\n【搭配詞】\nhire an accountant 聘請會計師\nsenior accountant 資深會計師\n【例句】\nThe company hired an accountant to manage their financial records. (公司聘請了一位會計師來管理他們的財務記錄。)"}, {"id": 69, "word": "accounting", "content": "accounting (n.) 會計\n【搭配詞】\naccounting firm 會計師事務所\naccounting department 會計部門\n【例句】\nThe accounting department will finalize the quarterly financial statements by Friday. (會計部門將於週五完成本季財務報表的最終整理。)"}, {"id": 70, "word": "accounts", "content": "accounts (n.) 帳戶、會計記錄、客戶群\n【搭配詞】\nAccounts Payable 應付帳款\nAccounts Receivable 應收帳款\n【例句】\nThe auditor will review the company's accounts to ensure accuracy. (審計師將審查公司的帳戶，以確保準確性。)"}, {"id": 71, "word": "accredit", "content": "accredit (v.) 認證、核可（某機構或組織符合特定標準）\n【搭配詞】\naccredited institution 認可機構\naccredited program 經鑑定合格的課程\n【例句】\nThe university is seeking accreditation from a recognized international body. (這所大學正在尋求從國際認可機構獲得認證。)"}, {"id": 72, "word": "accrual", "content": "accrual (n.) 應計、應計項目、權責發生制\n【詞性變化】\naccrue (v.)\n【搭配詞】\naccrual basis 應計基礎/應計制\naccrual accounting 應計會計\n【例句】\nThe company reported a significant accrual for future warranty claims. (該公司報告了一筆用於未來保固索賠的巨額應計款項。)"}, {"id": 73, "word": "accrue", "content": "accrue (v.) 累積、逐漸增加（通常指金額、利息、權益等）\n【搭配詞】\naccrue interest 累積利息\naccrued expenses 應計費用\n【例句】\nInterest will accrue on the outstanding balance if payment is not received by the due date. (如果未在到期日之前收到付款，未償餘額將產生利息。)"}, {"id": 74, "word": "accumulate", "content": "accumulate (v.) 累積、積累、逐漸增加\n【搭配詞】\naccumulate wealth 累積財富\naccumulate debt 累積債務\n【例句】\nThe company is trying to accumulate more capital to fund its expansion. (該公司正試圖累積更多資本以資擴張。)"}, {"id": 75, "word": "accumulated", "content": "accumulated (adj.) 累積的、積累的、(費用、債務等) 累積的\n【搭配詞】\naccumulated debt 累計債務\naccumulated experience 累積的經驗\n【例句】\nThe company has accumulated a significant amount of debt over the past year. (過去一年，該公司累積了相當多的債務。)"}, {"id": 76, "word": "accumulation", "content": "accumulation (n.) 累積、積累、堆積\n【搭配詞】\nwealth accumulation 財富累積\ncapital accumulation 資本累積\n【例句】\nThe company is experiencing a significant accumulation of inventory due to decreased sales. (由於銷售額下降，公司正經歷大量庫存積累。)"}, {"id": 77, "word": "accuracy", "content": "accuracy (n., adj.) 精確度、準確性\n【搭配詞】\nensure accuracy 確保準確性\nimprove accuracy 提高準確度\n【例句】\nThe report needs to be checked for accuracy before it's submitted to the board. (報告在提交給董事會之前，需要檢查其準確性。)"}, {"id": 78, "word": "accurate", "content": "accurate (adj.) 精確的、準確的、無誤的，符合事實的\n【搭配詞】\naccurate information 正確的資訊\naccurate data 精確的數據\n【例句】\nThe report needs to be reviewed to ensure the data is accurate. (需要審閱報告以確保數據的準確性。)"}, {"id": 79, "word": "accurately", "content": "accurately (adv.) 精確地、準確地，尤其指在數據、報告或資訊方面\n【搭配詞】\naccurately reflect the current market trends 準確反映當前市場趨勢\n【例句】\nThe report needs to be updated to accurately reflect the current market trends. (報告需要更新，以準確反映目前的市場趨勢。)"}, {"id": 80, "word": "accusation", "content": "accusation (n.) 控告\n【詞性變化】\naccuse (v.)\naccusatory (adj.)\n【搭配詞】\nmake an accusation against 對某人提出指控\ndeny an accusation 否認指控\n【例句】\nThe manager faced an accusation of unethical behavior. (經理面臨不道德行為的指控。)"}, {"id": 81, "word": "accuse", "content": "accuse (v.) 指控\n【例句】\nThe company accused the supplier of delivering substandard materials. (該公司指控供應商交付了品質不佳的材料。)"}, {"id": 82, "word": "accused", "content": "accused (adj., v.) 被指控、被控告\n【搭配詞】\nbe accused of + N/V-ing 被指控某事\n【例句】\nThe former employee was accused of leaking confidential company data. (這位前員工被指控洩漏了公司的機密數據。)"}, {"id": 83, "word": "accustom", "content": "accustom (v., adj.) 使習慣於、使適應\n【詞性變化】\ncustom (n.) ：習俗/海關\ncustomer (n.) ：顧客\n【搭配詞】\naccommodate 提供住宿/調整\n【例句】\nIt takes time to accustom yourself to a new working environment. (習慣新的工作環境需要時間。)"}, {"id": 84, "word": "accustomed", "content": "accustomed (adj.) 習慣於、適應於\n【詞性變化】\ncustom (n.) 習俗\n【例句】\nOur team is accustomed to working long hours during peak season. (我們的團隊習慣在旺季工作長時間。)"}, {"id": 85, "word": "achievable", "content": "achievable (adj.) 可實現的、可達成的\n【搭配詞】\nachievable goals 可達成的目標\n【例句】\nThe company set an achievable sales target for the new quarter. (公司為新季度設定了一個可實現的銷售目標。)"}, {"id": 86, "word": "achieve", "content": "achieve (v.) 達成、實現（目標、成就）\n【搭配詞】\nachieve a goal 達成目標\nachieve a target 達到指標\n【例句】\nThe company aims to achieve a 15% increase in sales this quarter. (本公司本季目標達成 15% 的銷售額增長。)"}, {"id": 87, "word": "achievement", "content": "achievement (n.) 成就\n【搭配詞】\noutstanding achievement 傑出成就\na sense of achievement 成就感\n【例句】\nThe company's new achievement initiative exceeded expectations in the first quarter. (公司的新achievement計畫在第一季度超出了預期。)"}, {"id": 88, "word": "achiever", "content": "achiever (n.) 績效達成者、有成就者\n【詞性變化】\nachieve (v.)\nachievement (n.) -成就/事蹟\n【搭配詞】\nhigh achiever 成就卓越的人\n【例句】\nOur company seeks to identify and recruit high-potential achievers. (我們公司致力於識別並招募具有高潛力的績效達成者。)"}, {"id": 89, "word": "achieving", "content": "achieving (v., adj.) 達成、實現、完成（目標、成就等）\n【搭配詞】\nachieving goals 達成目標\nachieving sales targets 達成銷售指標\n【例句】\nThe company is focused on achieving its sales targets for the quarter. (公司專注於實現本季的銷售目標。)"}, {"id": 90, "word": "acid", "content": "acid (n., adj.) 酸、酸性的\n【詞性變化】\nacidity (n.) 酸度\n【例句】\nThe chemical solution turned blue litmus paper red, indicating it was an acid. (化學溶液使藍色石蕊試紙變紅，表示它是一種酸。)"}, {"id": 91, "word": "acidic", "content": "acidic (adj.) 酸性的、酸的\n【詞性變化】\nacid (n.) 酸\nacidity (n.) 酸度\n【搭配詞】\nacidic soil 酸性土壤\nacidic solution 酸性溶液\n【例句】\nLemon juice is highly acidic and can be used to clean some surfaces. (檸檬汁的酸性很強，可以用來清潔一些表面。)"}, {"id": 92, "word": "ackerman", "content": "ackerman (n.) 阿克曼法（Ackerman method）是一種用於計算齒輪傳動比的公式，主要應用於工程設計\n【搭配詞】\nAckerman steering 阿克曼轉向\n【例句】\nThe engineer used the Ackerman formula to determine the optimal gear ratio for the new machinery. (這位工程師使用阿克曼法來確定新機器所需的最佳齒輪傳動比。)"}, {"id": 93, "word": "acknowledge", "content": "acknowledge (v.) 承認、認可\n【例句】\nThe manager acknowledged the team's hard work and dedication to the project. (經理肯定了團隊為專案付出的辛勤工作和奉獻精神。)"}, {"id": 94, "word": "acknowledging", "content": "acknowledging (v.) 表示理解、同意或接受某事、認可\n【搭配詞】\nacknowledging the receipt of something\n【例句】\nThe company acknowledged the customer's complaint and offered a full refund. (公司已承認客戶的投訴，並提供全額退款。)"}, {"id": 95, "word": "acquaint", "content": "acquaint (v.) 使…熟悉、使…認識（某人或某事）\n【搭配詞】\nacquaint someone with something 使某人熟悉某事\n【例句】\nThe new employee needs to be acquainted with the company's policies and procedures. (這位新進員工需要熟悉公司的政策和流程。)"}, {"id": 96, "word": "acquaintance", "content": "acquaintance (n.) 認識的人，熟人（但不深交）\n【搭配詞】\nmake the acquaintance of someone 初次結識某人\na business acquaintance 生意上的熟人\n【例句】\nI have a few acquaintances in the marketing department, but I don't know them very well. (我在行銷部門有一些熟人，但我不認識他們很熟。)"}, {"id": 97, "word": "acquire", "content": "acquire (v.) 獲得、取得（通常指透過努力或購買）\n【搭配詞】\nacquire skills 習得技能\nacquire knowledge 獲得知識\n【例句】\nThe company aims to acquire a new software license to improve operational efficiency. (公司計畫購買新的軟體授權，以提高營運效率。)"}, {"id": 98, "word": "acquired", "content": "acquired (adj.) 獲得的、後天學得的、取得的\n【搭配詞】\nacquired company 被收購的公司\nnewly acquired assets 新購得的資產\n【例句】\nThe company has acquired a reputation for excellent customer service. (該公司已獲得良好的客戶服務聲譽。)"}, {"id": 99, "word": "acquisition", "content": "acquisition (n.) 收購、取得、獲得（通常指企業或資產）\n【例句】\nThe company announced the acquisition of a smaller competitor to expand its market share. (該公司宣布收購一家規模較小的競爭對手，以擴大其市場份額。)"}, {"id": 100, "word": "acre", "content": "acre (n.) 英畝（土地面積單位）\n【搭配詞】\nacreage 總英畝數、面積\nper acre 每英畝\n【例句】\nThe farm spans over 100 acres of land. (這農場佔地超過100英畝。)"}, {"id": 101, "word": "across", "content": "across (prep., adv.) 橫跨、穿過、在...的另一邊\n【例句】\nThe new bridge will allow employees to walk across the street to the office building. (新的橋樑將允許員工橫過馬路前往辦公大樓。)"}, {"id": 102, "word": "act", "content": "act (n., v.) 行動、行為、扮演（角色）\n【搭配詞】\nact as 擔任/充當\nact as a liaison 擔任聯絡人\n【例句】\nThe company is taking swift action to address the recent data breach. (公司正迅速採取行動以應對最近發生的資料外洩事件。)"}, {"id": 103, "word": "acting", "content": "acting (n., v.) 表演、演出（通常指戲劇、電影等）\n【例句】\nThe company hired an acting coach to improve the team's presentation skills. (公司聘請了一位表演老師來提升團隊的簡報技巧。)"}, {"id": 104, "word": "action", "content": "action (n., v.) 行動、為解決問題或達成目標而採取的具體措施或步驟，常用於商務環境中\n【搭配詞】\ntake action 採取行動\ncorrective action 矯正措施\n【例句】\nThe project manager outlined the next actions required to meet the deadline. (專案經理說明了為了趕上截止日期所需採取的下一步行動。)"}, {"id": 105, "word": "activate", "content": "activate (v.) 啟動、啟用、使生效\n【搭配詞】\nactivate an account 開通帳戶\nactivate a credit card 開卡\n【例句】\nPlease activate your account by clicking the link in the confirmation email. (請點擊確認郵件中的連結以啟用您的帳戶。)"}, {"id": 106, "word": "activated", "content": "activated (v., adj.) 啟動、啟用、使生效\n【詞性變化】\nactive (adj.) 強調持續有效的狀態\n【搭配詞】\nactivated account 已啟用的帳戶\nactivated credit card 已開通的信用卡\n【例句】\nThe security system was activated by the motion sensor. (運動感應器啟動了安全系統。)"}, {"id": 107, "word": "activation", "content": "activation (n.) 啟動、激活、觸發\n【詞性變化】\nactivate (v.)\n【搭配詞】\naccount activation 帳戶啟用\nsoftware activation 軟體啟動\n【例句】\nPlease follow the instructions for product activation after installation. (請按照說明在安裝後完成產品啟動。)"}, {"id": 108, "word": "active", "content": "active (adj., v.) 積極的、活躍的、正在運作的\n【搭配詞】\ntake an active role in something 在某事中扮演積極角色\nbe an active participant 作為積極參與者\n【例句】\nThe company is actively seeking new markets to expand its business. (該公司正積極尋找新的市場以擴展其業務。)"}, {"id": 109, "word": "actively", "content": "actively (adv.) 積極地、活躍地、主動地\n【詞性變化】\nactive (adj.)\nact (v.)\n【搭配詞】\nactively seeking 積極尋找\nactively involved in 積極參與\n【例句】\nThe company is actively seeking new talent to join its team. (該公司正積極尋找新人才加入其團隊。)"}, {"id": 110, "word": "activist", "content": "activist (n.) 社運人士、行動主義者\n【搭配詞】\nenvironmental activist 環保人士\npolitical activist 政治活動家\n【例句】\nThe environmental activist campaigned for stricter pollution controls. (這位環保社運人士呼籲實施更嚴格的污染控制。)"}, {"id": 111, "word": "activities", "content": "activities (n.) 活動、事務、業務\n【搭配詞】\noutdoor activities 戶外活動\nbusiness activities 商務活動\n【例句】\nThe company organizes team-building activities to improve employee morale. (公司組織團隊建設活動以提升員工士氣。)"}, {"id": 112, "word": "activity", "content": "activity (n.) 活動、事務、業務\n【搭配詞】\noutdoor activities 戶外活動\neconomic activity 經濟活動\n【例句】\nThe company organized a team-building activity to improve employee morale. (公司組織了一項團隊建設活動以提升員工士氣。)"}, {"id": 113, "word": "actor", "content": "actor (n.) 演員、表演者（通常指電影、電視或舞台上的）\n【搭配詞】\nvoice actor 配音員\nlead actor 主角\n【例句】\nThe company hired a well-known actor to endorse their new product. (該公司聘請了一位知名的演員來代言他們的新產品。)"}, {"id": 114, "word": "actress", "content": "actress (n.) 女演員、表演電影、電視或舞台的女性\n【搭配詞】\naward-winning actress 獲獎女演員\nlead actress 女主角\n【例句】\nThe company hired a famous actress to endorse their new product line. (該公司聘請了一位知名女演員來代言他們的新產品線。)"}, {"id": 115, "word": "acts", "content": "acts (n., v.) 行為、作為、行動\n【例句】\nThe company's actions demonstrated a commitment to environmental sustainability. (該公司的行為展現了對環境永續發展的承諾。)"}, {"id": 116, "word": "actual", "content": "actual (adj.) 實際的、真實的、現實的\n【搭配詞】\nactual cost 實際成本\nactual sales figures 實際銷售數字\n【例句】\nThe actual cost of the project exceeded the initial budget by 15%. (專案的實際成本比最初預算高出 15%。)"}, {"id": 117, "word": "actually", "content": "actually (adv.) 實際上、原來、事實上（用於強調或修正之前的說法）\n【搭配詞】\nactually need 真的需要\nactually mean 實際意思是\n【例句】\nActually, the project deadline has been extended to next Friday. (實際上，這個專案的截止日期已經延遲到下週五。)"}, {"id": 118, "word": "acute", "content": "acute (adj.) 急性的、嚴重的、敏銳的（指疼痛、問題或情況）\n【搭配詞】\nan acute shortage of skilled labor 技術勞工嚴重短缺\n【例句】\nThe company is facing an acute shortage of skilled labor. (公司正面臨嚴重的技術人才短缺。)"}, {"id": 119, "word": "ad", "content": "ad (n.) 廣告（advertisement 的縮寫）\n【詞性變化】\nadd (v.) 增加/加總\n【搭配詞】\nplace an ad 刊登廣告\nrun an ad 執行/刊登廣告\n【例句】\nWe need to run an ad in the local newspaper to promote our new product. (我們需要在當地報紙上刊登一則廣告來推廣我們的新產品。)"}, {"id": 120, "word": "adapt", "content": "adapt (v.) 適應、調整、使符合\n【例句】\nThe company needs to adapt its marketing strategy to the changing market trends. (公司需要調整其行銷策略以適應不斷變化的市場趨勢。)"}, {"id": 121, "word": "adaptability", "content": "adaptability (n.) 適應性、變通能力\n【搭配詞】\ndemonstrate adaptability 展現適應力\n【例句】\nThe company values employees with a high degree of adaptability to handle unexpected changes in the market. (公司重視具備高度適應性的員工，以應對市場上突發的變化。)"}, {"id": 122, "word": "adaptable", "content": "adaptable (adj.) 適應性強的、能適應變化的\n【搭配詞】\nhighly adaptable 高度適應力的\n【例句】\nThe company needs employees who are adaptable to changing market conditions. (公司需要能夠適應市場變化的人才。)"}, {"id": 123, "word": "adaptation", "content": "adaptation (n.) 適應、改編\n【詞性變化】\nadaptable (adj.) 具適應力的\n【搭配詞】\nadaptation to new regulations 適應新法規\nmarket adaptation 市場適應\n【例句】\nThe company's adaptation approach needs to be updated. (公司的適應方法需要更新。)"}, {"id": 124, "word": "adapted", "content": "adapted (v., adj.) 調整、適應（以符合新的條件或需求）\n【例句】\nThe company has adapted its marketing strategy to appeal to a younger demographic. (公司已調整其行銷策略，以吸引年輕族群。)"}, {"id": 125, "word": "adapter", "content": "adapter (n.) 轉接器、轉換器、適配器\n【詞性變化】\nadapt (v.) 適應\n【搭配詞】\npower adapter 電源轉接器\ntravel adapter 旅行轉接頭\n【例句】\nI need an adapter to connect my old monitor to the new laptop. (我需要一個轉接器才能把我的舊螢幕接到新筆電上。)"}, {"id": 126, "word": "adapting", "content": "adapting (v., adj.) 適應、調整以符合新的條件或情況\n【例句】\nThe company is adapting its marketing strategy to reach a younger demographic. (公司正在調整其行銷策略，以接觸年輕族群。)"}, {"id": 127, "word": "adaptive", "content": "adaptive (adj.) 適應性的、能適應的\n【詞性變化】\nadopt (v.) 採用\nadapt (v.)\n【搭配詞】\nadaptive technology 自適應技術\nadaptive leadership 適應型領導\n【例句】\nThe company needs an adaptive strategy to respond to rapid market changes. (公司需要一個適應性策略來應對快速的市場變化。)"}, {"id": 128, "word": "add", "content": "add (v.) 增加、加上、添加\n【搭配詞】\nin addition to 除了...之外\n【例句】\nCould you please add this item to the purchase order? (您能請將此項目加入購買訂單嗎？)"}, {"id": 129, "word": "added", "content": "added (v., adj.) 新增、附加、增加\n【搭配詞】\nadded value 附加價值\nadded benefit 額外好處\n【例句】\nThe marketing team added a new feature to the product to attract more customers. (行銷團隊為產品新增了一個功能，以吸引更多客戶。)"}, {"id": 130, "word": "addicted", "content": "addicted (adj., v.) 對某事物產生強烈成癮，無法自拔、沉迷於某事物\n【例句】\nThe company is concerned that some employees are addicted to social media during work hours. (公司擔心有些員工在工作時間沉迷於社群媒體。)"}, {"id": 131, "word": "adding", "content": "adding (v., adj.) 增加、附加、增添\n【詞性變化】\nadditional (adj.) 額外的\naddition (n.) 增加物\n【搭配詞】\nadding value to 為...增值\nadding an item to the agenda 將項目加入議程\n【例句】\nThe company is adding new features to its software to improve user experience. (該公司正在為其軟體新增功能，以改善使用者體驗。)"}, {"id": 132, "word": "addition", "content": "addition (n.) 加法、額外增加、附加物\n【搭配詞】\nIn addition to + N/Ving 除了...之外\n【例句】\nThe project budget requires an addition of $5,000 for unexpected expenses. (專案預算需要額外增加 5,000 美元以應付 непредвиденные расходы。)"}, {"id": 133, "word": "additional", "content": "additional (adj., adv.) 額外的、附加的、補充的\n【搭配詞】\nadditional information 額外資訊\nadditional costs/charges 額外費用\n【例句】\nThe company is offering an additional 10% discount for loyal customers. (公司為忠誠客戶提供額外 10% 的折扣。)"}, {"id": 134, "word": "additionally", "content": "additionally (adv.) 此外、另外、額外地\n【詞性變化】\nadditional (adj.) 例如：additional information\naddition (n.)\n【例句】\nThe project budget has increased; additionally, the deadline has been extended. (專案預算已增加；此外，截止日期也已延長。)"}, {"id": 135, "word": "address", "content": "address (n., v.) 地址、（正式）稱謂、處理（問題、信件等）\n【搭配詞】\naddress an issue 處理議題\naddress concerns 處理疑慮\n【例句】\nPlease send the invoice to the following address. (請將發票寄至以下地址。)"}, {"id": 136, "word": "addressed", "content": "addressed (v.) （正式地）處理、解決、（信件、包裹等）寄達\n【搭配詞】\naddressed the issue 處理問題\naddressed the concern 回應擔憂\n【例句】\nThe manager addressed the team's concerns about the new project timeline. (經理解決了團隊對新項目時間表的擔憂。)"}, {"id": 137, "word": "addressing", "content": "addressing (v., adj.) 處理、解決、（信件、包裹等）寄送至、（問題、議題等）探討\n【例句】\nThe IT department is addressing the network outage as a top priority. (資訊部門正將網路中斷視為首要任務來處理。)"}, {"id": 138, "word": "adds", "content": "adds (v.) 增加、附加、添加\n【詞性變化】\nads (n.) ：廣告\n【搭配詞】\nadds value to 為...增加價值\nadds a feature 增加功能\n【例句】\nThe software update adds several new features to improve user experience. (這項軟體更新增加了幾個新功能，以提升使用者體驗。)"}, {"id": 139, "word": "adductor", "content": "adductor (n.) 內收肌 (指使肢體靠近身體中線的肌肉)\n【搭配詞】\nadductor muscle 收肌\nhip adductors 髖收肌群\n【例句】\nThe adductor muscles in the thigh are crucial for activities like walking and running. (大腿的內收肌對於走路和跑步等活動至關重要。)"}, {"id": 140, "word": "adept", "content": "adept (adj.) 擅長、精通、熟練\n【搭配詞】\nbe adept at negotiating 擅長談判\n【例句】\nShe is adept at using various software programs, making her a valuable asset to the team. (她擅長使用各種軟體程式，使她成為團隊中寶貴的資產。)"}, {"id": 141, "word": "adequate", "content": "adequate (adj.) 足夠的、適當的、滿足需求的\n【搭配詞】\nadequate funding 充足資金\nadequate inventory 足夠庫存\n【例句】\nThe company's current resources are adequate to handle the project's initial phase. (目前公司的資源足以應付專案的初步階段。)"}, {"id": 142, "word": "adequately", "content": "adequately (adv.) 充份地、適當地、足以\n【搭配詞】\nadequately prepared 準備充足\nadequately funded 資金充足\n【例句】\nThe company ensured that all employees were adequately trained before taking on new responsibilities. (公司確保所有員工在承擔新職責之前都得到了充分的培訓。)"}, {"id": 143, "word": "adhere", "content": "adhere (v.) 遵守、堅持、黏附\n【例句】\nAll employees are required to adhere to the company's code of conduct. (所有員工都必須遵守公司的行為準則。)"}, {"id": 144, "word": "adisa", "content": "adisa (n.) （電腦）管理系統、系統管理員\n【搭配詞】\nadvise someone to do something 建議某人做某事\n【例句】\nThe IT department relies on the system administrator to maintain network security. (IT 部門依靠系統管理員來維護網路安全。)"}, {"id": 145, "word": "adjacent", "content": "adjacent (adj.) 緊鄰的、相鄰的\n【例句】\nThe conference room is adjacent to the cafeteria, making it convenient for attendees to grab lunch. (會議室緊鄰餐廳，讓與會者方便用餐。)"}, {"id": 146, "word": "adjourn", "content": "adjourn (v.) 暫緩、延期（會議、審判等）\n【搭配詞】\nadjourn a meeting 休會/結束會議\n【例句】\nDue to unforeseen circumstances, the meeting will be adjourned until next week. (由於突發狀況，會議將延期至下週舉行。)"}, {"id": 147, "word": "adjournment", "content": "adjournment (n., v.) （會議、辯論等）休會、延會\n【搭配詞】\nmove for adjournment 提議休會\ngrant an adjournment 准許延期或休會\n【例句】\nDue to unforeseen circumstances, the meeting was adjourned until further notice. (由於突發狀況，會議已延會，暫停至另行通知。)"}, {"id": 148, "word": "adjust", "content": "adjust (v.) 調整、適應、修改\n【搭配詞】\nadjust the settings 調整設定\nadjust to the new environment 適應新環境\n【例句】\nPlease adjust the font size to 12 points for better readability. (請將字體大小調整為 12 點，以提高可讀性。)"}, {"id": 149, "word": "adjusted", "content": "adjusted (adj., v.) 調整、修改（以符合特定標準或需求）\n【搭配詞】\nseasonally adjusted 季節性調整後的\nadjusted budget 調整後的預算\n【例句】\nThe project timeline was adjusted to accommodate the unexpected delay. (專案時程因突發延遲而被調整。)"}, {"id": 150, "word": "adjustment", "content": "adjustment (n.) 調整、適應\n【搭配詞】\nmake an adjustment 進行調整\nprice adjustment 價格調整\n【例句】\nThe department implemented innovative adjustment procedures to improve operational efficiency. (部門實施創新的adjustment程序以提高營運效率。)"}, {"id": 151, "word": "adjustments", "content": "adjustments (n.) 調整、修改（以適應新情況或需求）\n【搭配詞】\nmake adjustments to 對...進行調整\nminor adjustments 微調\n【例句】\nThe company is making adjustments to its marketing strategy to better reach its target audience. (公司正在調整其營銷策略，以更好地接觸目標受眾。)"}, {"id": 152, "word": "admin", "content": "admin (n.) 管理者、管理員、系統管理員\n【搭配詞】\nadmin assistant 行政助理\nadmin staff 行政人員\n【例句】\nThe IT admin is responsible for maintaining the company's network security. (IT 管理員負責維護公司的網路安全。)"}, {"id": 153, "word": "administer", "content": "administer (v.) 管理、執行、提供（測試、藥物等）\n【搭配詞】\nadminister a test 舉行考試\nadminister a project 管理專案\n【例句】\nThe HR department will administer the employee performance review process. (人力資源部門將管理員工績效考核流程。)"}, {"id": 154, "word": "administration", "content": "administration (n.) 行政管理、管理層、行政部門\n【搭配詞】\nadministration office 行政辦公室\nbusiness administration 工商管理\n【例句】\nThe company's administration is responsible for handling employee benefits and payroll. (公司的行政部門負責處理員工福利和薪資。)"}, {"id": 155, "word": "administrative", "content": "administrative (adj.) 與行政管理相關的、行政上的\n【詞性變化】\nadministration (n.) 行政/管理\n【搭配詞】\nadministrative assistant 行政助理\nadministrative duties 行政職責\n【例句】\nThe administrative assistant is responsible for scheduling meetings and managing correspondence. (行政助理負責安排會議和管理郵件。)"}, {"id": 156, "word": "administrator", "content": "administrator (n.) 管理者、行政人員\n【搭配詞】\nsystem administrator 系統管理員\ndatabase administrator 資料庫管理員\n【例句】\nThe administrator is responsible for managing the company's IT infrastructure. (行政人員負責管理公司的 IT 基礎設施。)"}, {"id": 157, "word": "admire", "content": "admire (v.) 欽佩、讚賞、欣賞\n【搭配詞】\nadmire her for her professional dedication 因專業敬業而欽佩她\n【例句】\nI really admire her dedication to her work. (我真的很欣賞她對工作的奉獻。)"}, {"id": 158, "word": "admired", "content": "admired (adj.) 受到讚賞、尊敬、被推崇\n【搭配詞】\nwidely admired 深受推崇\n【例句】\nThe company's commitment to sustainability is widely admired by its stakeholders. (公司對可持續發展的承諾廣受其利害關係人的讚賞。)"}, {"id": 159, "word": "admiringly", "content": "admiringly (adv.) 表示讚賞或欽佩的語氣、以讚賞的態度\n【搭配詞】\nspeak admiringly of someone 讚賞地談論某人\nlook admiringly at something 讚賞地看著某物\n【例句】\nThe manager listened to her proposal admiringly, impressed by her innovative ideas. (經理對她的提案傾聽，並以欽佩的態度，因為她有創新的想法。)"}, {"id": 160, "word": "admission", "content": "admission (n., v.) 入學許可、入場費、（對某事）承認、同意\n【搭配詞】\nadmission fee 入場費\nfree admission 免費入場\n【例句】\nThe university requires an admission fee of $50 for the application process. (大學要求申請流程的入學費為 50 美元。)"}, {"id": 161, "word": "admit", "content": "admit (v.) 承認、坦白、允許進入\n【例句】\nThe company admitted a slight delay in the project's completion. (公司承認專案完成略有延遲。)"}, {"id": 162, "word": "admitted", "content": "admitted (v.) 承認、允許進入、接納（某事）\n【搭配詞】\nadmitted making a mistake 承認犯錯\n【例句】\nThe company admitted a mistake in the report and issued a public apology. (公司承認報告中存在錯誤，並發布了公開道歉。)"}, {"id": 163, "word": "admittedly", "content": "admittedly (adv.) 坦率地說、不得不承認\n【搭配詞】\nadmittedy difficult 確實困難\nadmittedly small 確實很小\n【例句】\nAdmittedly, the project faced some unexpected challenges, but the team worked diligently to overcome them. (坦率地說，這個專案面臨了一些意想不到的挑戰，但團隊努力克服了它們。)"}, {"id": 164, "word": "adolescent", "content": "adolescent (n., adj.) 青少年、青春期的\n【搭配詞】\nadolescent development 青少年發展\nadolescent behavior 青少年行為\n【例句】\nThe program aims to support adolescents struggling with academic pressure. (該計畫旨在幫助面臨學業壓力的青少年。)"}, {"id": 165, "word": "adopt", "content": "adopt (v.) 採用、收養、實施、執行\n【搭配詞】\nadopt a policy 採取政策\nadopt a strategy 採用策略\n【例句】\nThe company decided to adopt a new performance evaluation system to improve employee productivity. (公司決定採用新的績效評估系統以提高員工生產力。)"}, {"id": 166, "word": "adoption", "content": "adoption (n.) 領養、採納、採用、接受\n【詞性變化】\nadopt (v.)\nadoptive (adj.)\n【搭配詞】\nadoption of new technology 採用新技術\nwidespread adoption 廣泛採用\n【例句】\nThe company announced the adoption of a new privacy policy. (公司宣布採用新的隱私政策。)"}, {"id": 167, "word": "ads", "content": "ads (n.) 廣告、廣告宣傳\n【搭配詞】\nplace an ad 刊登廣告\nrun an ad 投放/執行廣告\n【例句】\nThe company launched a series of online ads to promote its new product. (該公司推出一系列線上廣告以推廣其新產品。)"}, {"id": 168, "word": "adult", "content": "adult (n.) 成年人、成人（指已達到法定成年年齡的人）\n【詞性變化】\nadulterate (v.) 摻雜、變質\n【搭配詞】\nadult supervision 成人監督\nadult fare 成人票價\n【例句】\nThe company offers a comprehensive benefits package for all adult employees. (公司為所有成年員工提供全面的福利方案。)"}, {"id": 169, "word": "advance", "content": "advance (v., n., adj.) 提前、預先、晉升、提高\n【搭配詞】\nin advance 事先\nadvance notice 事先通知\n【例句】\nThe company decided to advance the project deadline by a week. (公司決定將專案截止日期提前一週。)"}, {"id": 170, "word": "advanced", "content": "advanced (adj.) 高級的、進階的、高階的（指程度、技能或知識等達到較高的水平）\n【詞性變化】\nadvance (adj.) /名詞，指預先的、前進\n【搭配詞】\nadvanced technology 先進技術\nadvanced degree 高等學位\n【例句】\nThe company is looking for candidates with advanced Excel skills. (公司正在尋找具備進階 Excel 技能的候選人。)"}, {"id": 171, "word": "advancement", "content": "advancement (n.) 進步、提前\n【搭配詞】\ncareer advancement 職業晉升\ntechnological advancement 技術進步\n【例句】\nThe department implemented innovative advancement procedures to improve operational efficiency. (部門實施創新的advancement程序以提高營運效率。)"}, {"id": 172, "word": "advantage", "content": "advantage (n., v., adj.) 優勢、有利條件、利益\n【搭配詞】\ntake advantage of 利用、趁機\ncompetitive advantage 競爭優勢\n【例句】\nHaving a strong network can be a significant advantage in the job market. (擁有強大的社交網絡在就業市場上可能是一個顯著的優勢。)"}, {"id": 173, "word": "advantages", "content": "advantages (n.) 優勢、好處、利益\n【搭配詞】\ntake advantage of 利用、趁機\ncompetitive advantage 競爭優勢\n【例句】\nOur company's main advantage is our commitment to providing high-quality products. (我們公司的主要優勢是我們致力於提供高品質的產品。)"}, {"id": 174, "word": "adventure", "content": "adventure (n., v.) 冒險、刺激的經歷\n【詞性變化】\nadventurous (adj.) 愛冒險的\n【搭配詞】\nsense of adventure 冒險精神\noutdoor adventure 戶外冒險\n【例句】\nThe company is planning a team-building adventure trip to promote collaboration. (公司正在計劃一次團隊建設冒險旅行，以促進合作。)"}, {"id": 175, "word": "adverse", "content": "adverse (adj., adv.) 不利的、負面的、相反的\n【搭配詞】\nadverse weather conditions 惡劣天氣\nadverse effect/impact on 對...的不利影響\n【例句】\nThe company faced adverse market conditions after the economic downturn. (在經濟衰退後，該公司面臨不利的市場環境。)"}, {"id": 176, "word": "adversely", "content": "adversely (adv.) 不利地、負面地、相反地\n【例句】\nThe company's reputation was adversely affected by the negative publicity. (負面新聞對公司的聲譽產生了不利影響。)"}, {"id": 177, "word": "adversity", "content": "adversity (n.) 逆境、困境、不利情況\n【詞性變化】\novercome (v.) 克服\nadversary (n.) 指對手、敵手\n【搭配詞】\novercome 克服\nface 面對\n【例句】\nThe company faced significant adversity due to the global economic downturn. (由於全球經濟衰退，該公司面臨著嚴重的逆境。)"}, {"id": 178, "word": "advertise", "content": "advertise (v.) （透過媒體等）宣傳、廣告、推銷\n【搭配詞】\nadvertise for a position\nadvertise on/in platform\n【例句】\nThe company plans to advertise its new product on social media platforms. (該公司計畫在社交媒體平台上宣傳其新產品。)"}, {"id": 179, "word": "advertised", "content": "advertised (adj.) （商品、服務等）已做廣告的、宣傳過的\n【搭配詞】\nas advertised 如廣告所說的\n【例句】\nThe company's new product was heavily advertised on television and online. (該公司的最新產品在電視和線上大力宣傳。)"}, {"id": 180, "word": "advertisement", "content": "advertisement (n.) 廣告、宣傳（通常指付費的訊息，用於推廣產品或服務）\n【例句】\nThe company launched a new advertisement campaign to boost sales. (該公司推出了一項新的廣告活動以提高銷售額。)"}, {"id": 181, "word": "advertisements", "content": "advertisements (n.) 廣告、廣告宣傳\n【搭配詞】\nplace an advertisement 刊登廣告\nclassified advertisements 分類廣告\n【例句】\nThe company launched a series of advertisements to promote its new product line. (該公司推出一系列廣告，以推廣其新產品線。)"}, {"id": 182, "word": "advertiser", "content": "advertiser (n.) 廣告商、刊登廣告者、登廣告的公司\n【搭配詞】\npotential advertisers 潛在廣告商\nlocal advertisers 在地廣告商\n【例句】\nThe advertiser launched a new campaign to reach a younger audience. (該廣告商推出了一項新活動，以接觸更年輕的受眾。)"}, {"id": 183, "word": "advertising", "content": "advertising (n.) 廣告、廣告活動、（公司）宣傳推廣\n【搭配詞】\nadvertising campaign 廣告活動\nadvertising agency 廣告代理商\n【例句】\nThe company invested heavily in advertising to boost sales during the holiday season. (為了在節假日期間提高銷售額，該公司投入了大量資金進行廣告宣傳。)"}, {"id": 184, "word": "advice", "content": "advice (n., v.) 建議、忠告（通常基於經驗或專業知識）\n【搭配詞】\nseek/ask for advice 尋求建議\nfollow/take someone's advice 聽從建議\n【例句】\nI would appreciate your advice on how to negotiate a better deal with the supplier. (我會很感激您能給我一些關於如何與供應商談判更好協議的建議。)"}, {"id": 185, "word": "advisable", "content": "advisable (adj.) 建議的、可取的、明智的\n【詞性變化】\nadvisory (adj.) /名詞，指顧問的或警報公告，如 travel advisory\n【搭配詞】\nIt is advisable for someone\nhighly advisable 非常明智的\n【例句】\nIt's advisable to review the contract carefully before signing. (簽署合約前仔細審閱是明智的。)"}, {"id": 186, "word": "advise", "content": "advise (v.) 建議、勸告（通常基於專業知識或經驗）\n【搭配詞】\nadvise someone to do something 建議某人做某事\nstrongly advise 強烈建議\n【例句】\nThe consultant advised the company to invest in new technology to improve efficiency. (顧問建議公司投資新技術以提高效率。)"}, {"id": 187, "word": "advised", "content": "advised (v., adj.) 建議、忠告（過去式或形容詞\n【搭配詞】\nill-advised 不明智的\nwell-advised 明智的\n【例句】\nThe manager advised the team to submit the report by Friday. (經理建議團隊在星期五前提交報告。)"}, {"id": 188, "word": "adviser", "content": "adviser (n.) 顧問、建議人\n【搭配詞】\nfinancial adviser 財務顧問\nlegal adviser 法律顧問\n【例句】\nBefore making a significant investment, it's wise to consult a financial adviser. (在做出重大投資之前，最好諮詢財務顧問。)"}, {"id": 189, "word": "advises", "content": "advises (v.) 建議、勸告\n【搭配詞】\nadvise someone to do something 建議某人做某事\nstrongly advise 強烈建議\n【例句】\nThe consultant advises the company to invest in renewable energy. (顧問建議公司投資再生能源。)"}, {"id": 190, "word": "advisor", "content": "advisor (n.) 顧問、建議人（通常指在特定領域提供專業意見的人）\n【詞性變化】\nadvice (n.) 不可數且指建議內容\n【搭配詞】\nfinancial advisor 財務顧問\nlegal advisor 法律顧問\n【例句】\nBefore making any investment decisions, it's wise to consult a financial advisor. (在做出任何投資決策之前，最好諮詢財務顧問。)"}, {"id": 191, "word": "advisory", "content": "advisory (adj.) 諮詢的、建議性的、提供建議的\n【搭配詞】\ntravel advisory 旅遊警示\nadvisory board 顧問委員會\n【例句】\nThe company released an advisory notice regarding the potential risks of the new product. (公司發布了一份諮詢公告，說明了新產品潛在的風險。)"}, {"id": 192, "word": "advocate", "content": "advocate (v., n.) 支持、倡導、為...辯護\n【例句】\nThe company advocates for sustainable practices throughout its supply chain. (該公司在其供應鏈的各個環節倡導可持續發展的措施。)"}, {"id": 193, "word": "aerial", "content": "aerial (adj., adv.) 高空的、空中傳輸的\n【詞性變化】\narea (n.) 區域\n【搭配詞】\naerial view 鳥瞰圖\naerial photography 航拍\n【例句】\nThe company is investing in aerial photography to showcase its new resort. (該公司正在投資空中攝影，以展示其新的度假村。)"}, {"id": 194, "word": "aerobic", "content": "aerobic (adj.) 有氧的、需氧的\n【詞性變化】\naerobically (adv.)\n【搭配詞】\naerobic exercise 有氧運動\naerobic classes 有氧課程\n【例句】\nAerobic exercise helps improve cardiovascular health. (有氧運動有助於改善心血管健康。)"}, {"id": 195, "word": "aerosol", "content": "aerosol (n., adj.) 氣膠、噴霧劑\n【搭配詞】\naerosol spray 噴霧劑\naerosol can 噴霧罐\n【例句】\nPlease ensure the room is well-ventilated when using aerosol products. (使用噴霧產品時，請確保房間通風良好。)"}, {"id": 196, "word": "aesthetic", "content": "aesthetic (adj., n.) 美學的、美感的、審美的、美學，美感\n【搭配詞】\naesthetic appeal 美感吸引力\naesthetic value 美學價值\n【例句】\nThe interior designer has a keen eye for aesthetic details. (這位室內設計師對美學細節有敏銳的洞察力。)"}, {"id": 197, "word": "affair", "content": "affair (n.) （通常指不公開的）婚外情、（公司內部）事務、事件\n【搭配詞】\ncurrent affairs 時事\nforeign affairs 外交事務\n【例句】\nThe company is investigating an affair of interest involving a senior manager. (公司正在調查一位高階經理的不當利益衝突事件。)"}, {"id": 198, "word": "affect", "content": "affect (v.) 影響、左右、改變（某事物）\n【搭配詞】\nadversely affect 不利地影響\ndirectly affect 直接影響\n【例句】\nThe recent economic downturn has significantly affected the company's profits. (最近的經濟衰退對公司的利潤產生了顯著影響。)"}, {"id": 199, "word": "affected", "content": "affected (adj., v.) 受到…影響、受…所及\n【搭配詞】\nadversely affected 受不利影響\ndirectly affected 受直接影響\n【例句】\nThe company's profits were significantly affected by the recent economic downturn. (近期經濟衰退對公司的利潤產生了顯著影響。)"}, {"id": 200, "word": "affecting", "content": "affecting (adj., v.) 影響、左右、產生影響\n【搭配詞】\npolicies affecting small businesses 影響小企業的政策\nchanges affecting the workflow 影響工作流程的變動\n【例句】\nThe recent economic downturn is significantly affecting the company's sales figures. (最近的經濟衰退正在顯著影響公司的銷售數據。)"}, {"id": 201, "word": "affiliate", "content": "affiliate (v.) 關聯公司\n【例句】\nOur marketing affiliate program generates 30% of total online revenue. (我們的行銷affiliate計畫產生了線上總收入的30%。)"}, {"id": 202, "word": "affiliation", "content": "affiliation (n.) 隸屬關係、關聯、會員資格\n【搭配詞】\naffiliation with a professional organization 與專業組織的隸屬關係\npolitical affiliation 政治傾向\n【例句】\nThe company values employee affiliations with professional organizations. (公司重視員工與專業組織的隸屬關係。)"}, {"id": 203, "word": "affirm", "content": "affirm (v.) 肯定、斷言、證實、重申（承諾、立場等）、申明（在法庭上不宣誓而作證）\n【搭配詞】\naffirm a commitment 重申承諾\naffirm a decision 確認決定\n【例句】\nThe company affirmed its commitment to environmental protection. (該公司重申其對環境保護的承諾。)"}, {"id": 204, "word": "affirmation", "content": "affirmation (n.) 肯定、證實、宣言、（對信仰、感受的）申明\n【搭配詞】\nwords of affirmation 肯定與讚美的話語\nsolemn affirmation 莊嚴宣告\n【例句】\nHis daily affirmations help him maintain a positive mindset. (他的每日肯定語幫助他保持積極的心態。)"}, {"id": 205, "word": "affirmative", "content": "affirmative (adj., adv.) 肯定的\n【詞性變化】\naffirm (v.) ：確認、斷言\n【例句】\nThe manager gave an affirmative response to the proposal. (經理對該提案給出了肯定的回覆。)"}, {"id": 206, "word": "affix", "content": "affix (v., n.) 附加、黏貼、（語言學上）前綴或後綴\n【搭配詞】\naffix a signature to the contract 在合約上簽名\naffix a label to the crate 在貨箱上貼標籤\n【例句】\nThe company decided to affix a new logo to all marketing materials. (公司決定將新標誌附加到所有行銷材料上。)"}, {"id": 207, "word": "afford", "content": "afford (v.) 負擔得起、經得起（費用、開銷）\n【例句】\nThe company can afford to invest in new technology to improve efficiency. (公司有能力投資新技術來提高效率。)"}, {"id": 208, "word": "affordability", "content": "affordability (n.) 可負擔性、價格合理性\n【搭配詞】\nhousing affordability 房屋負擔能力\nprice affordability 價格承受度\n【例句】\nThe company is focusing on developing more affordable housing options for its employees. (公司正致力於為員工開發更多可負擔的住房選項。)"}, {"id": 209, "word": "affordable", "content": "affordable (adj.) 價格實惠的、負擔得起的\n【例句】\nWe're looking for an affordable supplier of raw materials to reduce production costs. (我們正在尋找一家價格實惠的原材料供應商，以降低生產成本。)"}, {"id": 210, "word": "afraid", "content": "afraid (adj., adv.) 害怕、擔心\n【例句】\nI'm afraid I won't be able to meet the deadline due to unforeseen circumstances. (恐怕由於一些不可預見的情況，我無法按時完成任務。)"}, {"id": 211, "word": "africa", "content": "africa (n.) 非洲\n【搭配詞】\nthe African market 非洲市場\nexpansion into Africa 進軍非洲\n【例句】\nOur company is exploring opportunities to expand its market share in Africa. (我們公司正在探索在非洲擴大市場份額的機會。)"}, {"id": 212, "word": "african", "content": "african (adj.) 與非洲相關的、非洲的、非洲人的\n【搭配詞】\nAfrican trade relations 非洲貿易關係\nAfrican branch office 非洲分公司\n【例句】\nThe company is launching a new line of African-inspired clothing. (該公司正在推出一系列受非洲文化啟發的服裝。)"}, {"id": 213, "word": "after", "content": "after (prep., adv., conj.) 在...之後、以後、然後\n【搭配詞】\nafter-sales service 售後服務\nimmediately after 在...之後不久\n【例句】\nLet's discuss this after the meeting. (我們在會議結束後討論這件事吧。)"}, {"id": 214, "word": "afternoon", "content": "afternoon (n.) 下午\n【搭配詞】\nafternoon shift 下午班次\nafternoon break 下午休息時間\n【例句】\nI have a meeting scheduled for this afternoon. (我今天下午有一個會議。)"}, {"id": 215, "word": "afterward", "content": "afterward (adv.) 其後、事後、之後\n【搭配詞】\nshortly afterward 不久之後\n【例句】\nAfterward, please submit your expense report to the accounting department. (事後，請將您的費用報表提交給會計部門。)"}, {"id": 216, "word": "again", "content": "again (adv.) 再次、又、再一次\n【例句】\nCould you please repeat that again? (你可以再重複一次嗎？)"}, {"id": 217, "word": "against", "content": "against (prep., adv.) 對抗、反對、與...相對、根據\n【搭配詞】\nvote against 投票反對\ndecide against 決定不...\n【例句】\nThe company is taking legal action against the supplier for breach of contract. (該公司因違反合約而對供應商採取法律行動。)"}, {"id": 218, "word": "age", "content": "age (n.) 年齡、年歲\n【搭配詞】\nage group 年齡層\ntarget age 目標年齡\n【例句】\nThe company has a policy of not discriminating based on age. (公司有不因年齡而歧視的政策。)"}, {"id": 219, "word": "agencies", "content": "agencies (n.) 機構、代理商（通常指政府或公司設立的執行特定任務的組織）\n【搭配詞】\nadvertising agencies 廣告代理商\ntravel agencies 旅行社\n【例句】\nThe recruitment agencies are assisting the company in finding qualified candidates. (招聘機構正在協助公司尋找合格的候選人。)"}, {"id": 220, "word": "agency", "content": "agency (n.) 經紀公司、代理商、機構\n【搭配詞】\ntravel agency 旅行社\nemployment agency 人力仲介\n【例句】\nOur company uses a recruitment agency to find qualified candidates for the marketing position. (我們公司使用招聘機構來為行銷職位尋找合格的候選人。)"}, {"id": 221, "word": "agenda", "content": "agenda (n.) 議程、待辦事項清單\n【搭配詞】\non the agenda 在議程上\nset the agenda 制定議程\n【例句】\nPlease review the agenda for tomorrow's meeting and come prepared to discuss your team's progress. (請檢閱明天會議的議程，並準備好討論您團隊的進展。)"}, {"id": 222, "word": "agent", "content": "agent (n.) 代表、代理人、經紀人（通常指處理特定事務的人員）\n【搭配詞】\ntravel agent 旅遊代辦\nreal estate agent 房產經紀人\n【例句】\nOur travel agent booked our flights and hotel. (我們的旅行社代理人幫我們預訂了機票和酒店。)"}, {"id": 223, "word": "agents", "content": "agents (n.) 代理人、經紀人、代表\n【搭配詞】\ntravel agents 旅遊代辦\nreal estate agents 房地產經紀人\n【例句】\nOur travel agents can assist you with booking flights and hotels. (我們的旅行社代理人可以協助您預訂機票和酒店。)"}, {"id": 224, "word": "ages", "content": "ages (n.) 年代、時期（通常指較長的時間段，尤其在商業語境中指公司、產品或服務的生命週期）\n【搭配詞】\nage 年齡、時代\nan age 長久之時，較少見於多益\n【例句】\nThis software has stood the test of ages and remains a vital tool for our operations. (這款軟體經受住了歲月的考驗，仍然是我們營運的重要工具。)"}, {"id": 225, "word": "aggravate", "content": "aggravate (v.) 使惡化、加重（問題、情況等）\n【搭配詞】\naggravate a situation 使情況惡化\naggravate an injury 使傷勢加重\n【例句】\nThe project delays will only aggravate the company's financial situation. (專案延遲只會加劇公司的財務狀況。)"}, {"id": 226, "word": "aggregate", "content": "aggregate (v., n., adj.) （動詞）聚集、合計、（名詞）總計、總數、集合體、（形容詞）合計的、總計的\n【搭配詞】\naggregate data 總計數據\naggregate demand 總需求\n【例句】\nWe need to aggregate the sales figures from all branches to get a complete picture. (我們需要匯集所有分公司的銷售數據才能了解全貌。)"}, {"id": 227, "word": "aggression", "content": "aggression (n., v.) 侵略性行為、冒犯性言行\n【搭配詞】\ndisplay aggression 表現出攻擊性\nunprovoked aggression 無端攻擊\n【例句】\nThe manager addressed the employee's aggression during the team meeting. (經理在團隊會議中處理了這位員工的侵略性行為。)"}, {"id": 228, "word": "aggressive", "content": "aggressive (adj.) 具有攻擊性或冒進的\n【搭配詞】\naggressive marketing campaign 積極的行銷活動\naggressive expansion plan 積極的擴張計畫\n【例句】\nThe salesperson's aggressive sales tactics alienated several potential clients. (這位銷售人員的強硬銷售策略讓幾位潛在客戶感到疏遠。)"}, {"id": 229, "word": "aggressively", "content": "aggressively (adv.) 強勢地、激進地（通常指以不妥協或具有侵略性的方式）\n【搭配詞】\naggressively market 積極推廣\naggressively expand 積極擴張\n【例句】\nThe company aggressively pursued new markets to increase its revenue. (該公司積極開拓新市場以增加收入。)"}, {"id": 230, "word": "agile", "content": "agile (adj.) 靈活的、適應性強的，能快速應變的\n【搭配詞】\nagile methodology 敏捷開發法\nagile team 敏捷團隊\n【例句】\nOur company needs to be more agile to respond quickly to changing market conditions. (為了快速應對不斷變化的市場狀況，我們公司需要更具靈活性。)"}, {"id": 231, "word": "aging", "content": "aging (adj., n.) 老化、逐漸變老（尤指人口結構中老年人口比例增加的趨勢）\n【詞性變化】\nolder (adj.)\noldest (adj.)\n【搭配詞】\naging population 高齡化人口\naging workforce 勞動力高齡化\n【例句】\nThe company is developing new products to appeal to the aging population. (該公司正在開發新產品，以吸引逐漸老化的消費族群。)"}, {"id": 232, "word": "ago", "content": "ago (adv.) …以前、…之前 (表示時間距離)\n【搭配詞】\nfor 持續多久\n【例句】\nThe project was completed three months ago. (這個專案是三個月前完成的。)"}, {"id": 233, "word": "agree", "content": "agree (v.) 同意、在討論或協商中達成一致意見\n【例句】\nAfter reviewing the contract terms, both parties agreed to proceed with the partnership. (在審閱合約條款後，雙方同意繼續合作。)"}, {"id": 234, "word": "agreeable", "content": "agreeable (adj.) （對某人或某事）欣然同意的、友善的、好相處的\n【搭配詞】\nbe agreeable to something 欣然同意某事、願意接受某提案\nan agreeable personality 宜人的性格\n【例句】\nThe client found the proposal agreeable and requested a follow-up meeting. (客戶認為提案內容可接受，並要求安排後續會議。)"}, {"id": 235, "word": "agreeably", "content": "agreeably (adv.) 令人滿意地、愉悅地、順從地\n【搭配詞】\nagreeably surprised 感到驚喜地愉快\nagreeably situated 地理位置宜人/環境優美\n【例句】\nThe project manager accepted the changes to the schedule agreeably. (專案經理順從地接受了對排程的變更。)"}, {"id": 236, "word": "agreed", "content": "agreed (v., adj.) 同意、贊同\n【搭配詞】\nagreed price 協議價格\nagreed terms 協定條款\n【例句】\nThe board of directors agreed to the proposed merger. (董事會同意了這項擬定的合併案。)"}, {"id": 237, "word": "agreeing", "content": "agreeing (adj., v.) 表示贊同或同意的狀態或動作\n【例句】\nThe board members were generally agreeing with the proposed merger. (董事會成員普遍對擬議的合併表示贊同。)"}, {"id": 238, "word": "agreement", "content": "agreement (n.) 協議、合約、一致的意見\n【搭配詞】\nreach an agreement 達成協議\nsign an agreement 簽署協議\n【例句】\nBoth parties signed the agreement to finalize the deal. (雙方簽署協議以完成交易。)"}, {"id": 239, "word": "agreements", "content": "agreements (n.) 協議、合約、諒解\n【搭配詞】\nreach an agreement 達成協議\nsign an agreement 簽署協議\n【例句】\nBoth parties must sign the agreements before the project can begin. (專案開始前，雙方必須簽署協議。)"}, {"id": 240, "word": "agrees", "content": "agrees (v.) 同意、贊同\n【搭配詞】\nagrees with 同意某人或觀點\nagrees to 同意某項計畫或提議\n【例句】\nThe board of directors agrees with the proposed merger. (董事會同意這項擬定的合併案。)"}, {"id": 241, "word": "agricultural", "content": "agricultural (adj.) 與農業相關的、農業的\n【搭配詞】\nagricultural products 農產品\nagricultura
